/* ---------- 设计令牌（浅色默认 + 深色映射，v2 双套） ---------- */
:root{
  color-scheme:light;
  /* v5（2026-10-01 顶栏重排）：顶栏高度抽成变量——它是「钉顶」体系的地基，
     详情页钉顶条 / Large Title 小标题 / 锚点滚动余量都按它算偏移。
     桌面单行 60px；≤560px 手机两行 110px（见文件末的顶栏两行段）。
     改顶栏高度只改这一处，别再往别处写死数字。 */
  --nav-h:60px;
  /* 主题色三件套：默认值 = 原站 klein 浅色；运行期由 applyColorTheme() 覆盖 */
  --brand:#3559d8; --brand-light:#edf0fb; --brand-hover:#2a46b4;
  --green:#00b42a; --green-light:#e8ffea;
  --red:#f53f3f; --red-light:#ffece8;
  --orange:#ff7d00; --orange-light:#fff7e8;
  --purple:#7c5ce0; --purple-light:#f3e8ff;
  --bg:#fff; --bg-soft:#f7f8fa; --bg-hover:#f2f3f5;
  --text:#1d2129; --text-2:#4e5969; --text-3:#6b7280;   /* v1.1.3（续 9）：--text-3 由 #86909c 调深。原值在白底 3.24:1、在 --bg-soft 上 3.05:1，低于 WCAG AA 正文门槛 4.5:1；新值 4.83:1 / 4.55:1。深色侧的同名变量在下面 html[data-theme="dark"] 块里单独定义，不受此处影响。 */
  --border:#e5e6eb; --border-light:#f0f1f3;
  --radius:12px;
  --shadow-card:0 1px 2px rgba(29,33,41,.05);
  --shadow-float:0 8px 30px rgba(0,0,0,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --anat-mark:#b45309;
  /* v2 语义面 / 灰阶 / diff / 高亮（深色模式整体重映射） */
  --surface:#fff;
  --nav-bg:rgba(255,255,255,.88);
  --gray-6:#c9cdd4;
  --gray-5:#e5e6eb;
  --gray-4:#b3bac6;
  --mark-bg:#fff3c2; --mark-tx:inherit;
  --diff-add-bg:#dafbe1; --diff-add-tx:#1a7f37;
  --diff-del-bg:#ffebe9; --diff-del-tx:#d1242f;
  --diff-hunk-bg:#ddf4ff; --diff-hunk-tx:#57606a;
  --green-border:#8ee2a3; --green-deep:#0d8a3e;
  --green-chip-bg:#dcfce7; --green-chip-tx:#15803d;
  --red-border:#f8b3ab;
  --pop-shadow:0 4px 14px rgba(29,33,41,.12);
  --mask:rgba(29,33,41,.4);
  --on-brand:#fff;
  --shadow-hover:0 8px 24px rgba(29,33,41,.10);
  --anat-bg:rgba(180,83,9,.07);
}
html[data-theme="dark"]{
  color-scheme:dark;
  /* 主题色三件套：默认值 = 原站 klein 深色 */
  --brand:#7b93ea; --brand-light:rgba(123,147,234,.15); --brand-hover:#8ba0ed;
  --green:#4ade80; --green-light:rgba(74,222,128,.13);
  --red:#ff7b72; --red-light:rgba(255,123,114,.13);
  --orange:#ffb25e; --orange-light:rgba(255,178,94,.13);
  --purple:#a78bfa; --purple-light:rgba(167,139,250,.15);
  --bg:#0e1014; --bg-soft:#151821; --bg-hover:#1d222d;
  --text:#e6e8ec; --text-2:#aab3bf; --text-3:#78828f;
  --border:#282e3a; --border-light:#1f232c;
  --shadow-card:0 1px 2px rgba(0,0,0,.45);
  --shadow-float:0 10px 34px rgba(0,0,0,.6);
  --anat-mark:#f0a860;
  --surface:#171b24;
  --nav-bg:rgba(14,16,20,.82);
  --gray-6:#4a5261;
  --gray-5:#282e3a;
  --gray-4:#5a6373;
  --mark-bg:rgba(250,204,21,.3); --mark-tx:inherit;
  --diff-add-bg:rgba(46,160,67,.2); --diff-add-tx:#7ee787;
  --diff-del-bg:rgba(248,81,73,.18); --diff-del-tx:#ffb1ab;
  --diff-hunk-bg:rgba(56,139,253,.16); --diff-hunk-tx:#8bb8f5;
  --green-border:rgba(74,222,128,.5); --green-deep:#4ade80;
  --green-chip-bg:rgba(74,222,128,.15); --green-chip-tx:#4ade80;
  --red-border:rgba(255,123,114,.5);
  --pop-shadow:0 6px 18px rgba(0,0,0,.5);
  --mask:rgba(0,0,0,.55);
  --on-brand:#0e1014;
  --shadow-hover:0 10px 28px rgba(0,0,0,.55);
  --anat-bg:rgba(240,168,96,.12);
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
/* v5（2026-09-27 整体细节对比补齐）：品牌色选中背景——参考站同款 var(--brand-light)，八色主题自动跟随 */
::selection{background:var(--brand-light)}

/* ---------- 顶栏（吸顶毛玻璃） ---------- */
.nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  height:var(--nav-h);padding:0 24px;background:var(--nav-bg);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light)}
.nav-brand{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:4px 6px;margin:-4px -6px}
.nav-logo{width:30px;height:30px;border-radius:8px;
  /* v5（2026-09-27）：logo 重设计——纯蓝底白字改为参考站品牌双色渐变（--theme-brand #3559d8 → hover #2a46b4）
     + 顶部高光内描边（Apple 质感）；暗色主题换亮一档的等价渐变 */
  background:linear-gradient(135deg,#3559d8,#2a46b4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.08);
  display:inline-flex;align-items:center;justify-content:center;color:var(--on-brand);font-weight:800;font-size:15px;
  transition:transform .36s cubic-bezier(.22,1,.36,1)}
html[data-theme="dark"] .nav-logo{background:linear-gradient(135deg,#7b93ea,#4c63c0)}
.nav-logo svg{width:14px;height:14px;display:block}   /* 14/30 = 47%，图形占方标自定比例（44–50%，本图鉴惯例；2026-09-29 事件二核实：HIG 无此量化口径，勿称 Apple 规范） */
/* v1.1.3（续 9）：:hover 与 :focus-visible 拆成两条规则。
   原因是 CSS 选择器列表「一项解析失败则整条规则作废」——旧浏览器（Safari/iOS <15.4、Firefox <85、
   Chrome <86）不认识 :focus-visible，同列写法会把 :hover 一起丢掉，品牌区悬停展开会整个失效。
   拆开后旧浏览器只丢焦点环、悬停照常。以下四条同因同改，勿再合并。 */
.nav-brand:hover .nav-logo{transform:scale(1.04) rotate(-2deg)}
.nav-brand:focus-visible .nav-logo{transform:scale(1.04) rotate(-2deg)}
/* v5（2026-09-27）：品牌文字舞台——对齐参考站 vh-logo-stage。
   简称常驻；悬停时舞台宽度展开（参考站同款曲线），全称与副题交叉淡入（淡出带模糊上移，参考站同时序）。
   宽度过渡为参考站「行内展开」形态的照搬（低频一次性、单行小元素；与动效红线的高频滚动场景不同，
   若要严守红线可改为浮层淡入，一句话可切换） */
.brand-stage{position:relative;display:block;height:34px;width:36px;
  transition:width .5s cubic-bezier(.22,1,.36,1)}
.nav-brand:hover .brand-stage{width:158px}
.nav-brand:focus-visible .brand-stage{width:158px}
.bs-rest{position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;pointer-events:none;
  font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--text);
  transition:opacity .24s ease,transform .42s cubic-bezier(.22,1,.36,1),filter .3s ease}
.bs-hover{position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .24s ease,transform .42s cubic-bezier(.22,1,.36,1),filter .3s ease}
.bs-hover b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;color:var(--text);line-height:1.25}
.bs-hover small{display:block;font-size:11px;color:var(--text-3);line-height:1.45}
.nav-brand:hover .bs-rest{opacity:0;transform:translateY(calc(-50% - 5px));filter:blur(2px)}
.nav-brand:focus-visible .bs-rest{opacity:0;transform:translateY(calc(-50% - 5px));filter:blur(2px)}
.nav-brand:hover .bs-hover{opacity:1;transform:translateY(-50%);transition-delay:.11s}
.nav-brand:focus-visible .bs-hover{opacity:1;transform:translateY(-50%);transition-delay:.11s}
.nav-links{display:flex;gap:4px;flex:none}
.nav-links a{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--text-2);cursor:pointer}   /* v1.1.3 修复：粗指针档（@media any-pointer:coarse）的 min-height:44px 会把盒子撑高，文字须 flex 居中——否则偏上 5px */
.nav-links a:hover{background:var(--bg-hover)}
.nav-links a.current{color:var(--brand);font-weight:600}
.nav-search{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 1 300px;
  border:1px solid var(--border);border-radius:10px;padding:7px 12px;background:var(--surface);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.nav-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.nav-search svg{flex:none;color:var(--text-3)}
.nav-search input{flex:1;min-width:0;border:0;outline:0;font-size:13.5px;color:var(--text);background:transparent;text-overflow:ellipsis}   /* v1.1.3：窄屏占位不再被硬裁半个字（原来是 clip） */
.nav-search input::placeholder{color:var(--text-3)}
.search-clear{flex:none;display:none;width:18px;height:18px;padding:0;border:0;border-radius:50%;
  background:var(--bg-hover);color:var(--text-3);font-size:12px;font-family:inherit;
  line-height:18px;text-align:center;cursor:pointer;user-select:none}
.nav-search.has-q .search-clear{display:block}
.nav-drawer-btn{display:none;flex:none;width:36px;height:36px;border:1px solid var(--border);border-radius:9px;
  background:var(--surface);color:var(--text-2);font-size:15px;cursor:pointer;align-items:center;justify-content:center}

/* ---------- v5（2026-09-27）：快捷键帮助面板（B3）+ 继续上次横幅（B1） ---------- */
.kbd-btn{flex:none;width:36px;height:36px;border:1px solid var(--border);border-radius:9px;
  background:var(--surface);color:var(--text-2);font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);
  transition:border-color .15s,color .15s}
.kbd-btn:hover{color:var(--brand);border-color:var(--brand)}
.kbd-ic{font-style:normal;display:inline-block;text-align:center}   /* v1.1.3：抽屉里给 ? 一个与色点同宽的图标位，两行标签才对得齐 */
.kbd-mask{position:fixed;inset:0;z-index:90;background:var(--mask);
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.kbd-mask[hidden]{display:none}
.kbd-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--pop-shadow);width:min(430px,100%);padding:18px 20px 14px}
.kbd-card h3{font-size:15px;margin-bottom:10px;overflow:hidden}
.kbd-card h3 .x{float:right;width:24px;height:24px;border:0;border-radius:6px;background:transparent;
  color:var(--text-3);cursor:pointer;font-size:12px;font-family:inherit;line-height:24px}
.kbd-card h3 .x:hover{background:var(--bg-hover);color:var(--text)}
.kbd-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:7px 0;border-top:1px solid var(--border-light);font-size:13px;color:var(--text-2)}
.kbd-row:first-of-type{border-top:0}
.kbd-row kbd{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--text);background:var(--bg-soft);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.resume-bar{display:flex;align-items:center;max-width:1440px;margin:0 auto;padding:10px 24px 0}
.resume-bar[hidden]{display:none}
.resume-bar .rb-card{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px 8px 14px;
  background:var(--brand-light);border:1px solid var(--brand);border-radius:10px;font-size:13px;color:var(--text-2)}
.resume-bar .rb-card span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-bar b{color:var(--brand);font-weight:600}
.resume-bar .rb-go{flex:none;margin-left:auto;border:0;border-radius:8px;background:var(--brand);color:var(--on-brand);
  font-size:12.5px;font-family:inherit;padding:5px 14px;cursor:pointer}
.resume-bar .rb-x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;
  color:var(--text-2);cursor:pointer;font-size:12px;font-family:inherit;line-height:22px}
.resume-bar .rb-x:hover{background:var(--bg-hover);color:var(--text)}

/* ---------- 布局：左栏是目录（一级主题 + 本主题分类），内容区在右 ---------- */
.catalog-layout{display:flex;gap:28px;max-width:1440px;margin:0 auto;padding:28px 24px 72px;align-items:flex-start}
/* v5（2026-09-26 使用者反馈）：更新日志是页面级视图——整页无侧栏、无抽屉按钮，主区限宽居中（对齐参考站 changelog 单栏形态） */
/* v5（2026-09-26 使用者反馈）：changelog 是页面级视图——整页无侧栏、主区限宽居中（对齐参考站 changelog 单栏形态）。
   v1.1.3：主区不再居中——改为与目录型视图同一条左边界（见下方 ≥961 的补位规则），
   这样列表 / 详情 / 更新 / 自测四个视图切来切去时，内容的左边线不跳。 */
body.is-changelog .side-nav{display:none}
body.is-changelog .nav-drawer-btn{display:none}
body.is-changelog .catalog-layout{display:block}
body.is-changelog .main{max-width:1080px;margin:0}
/* v5（2026-09-26）：changelog 两栏 = 左 sticky 边栏（时间定位 + 统计）+ 右条目流（DOM 结构与口径对齐参考站 changelog-sidebar） */
.cl-layout{display:flex;gap:44px;align-items:flex-start}
.cl-side{flex:0 0 176px;position:sticky;top:calc(var(--nav-h) + 28px)}
.cl-side-head{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.06em;padding:2px 0 8px}
.cl-side-nav{display:flex;flex-direction:column;gap:2px}
.cl-side-link{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--text-2);
  font-size:13px;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .15s,color .15s}
.cl-side-link:hover{background:var(--bg-hover);color:var(--text)}
.cl-side-link.on{background:var(--brand-light);color:var(--brand);font-weight:600}
.cl-side-link .cnt{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.cl-side-link.on .cnt{color:var(--brand)}
.cl-stats{margin-top:22px;padding-top:18px;border-top:1px solid var(--border-light);
  display:flex;flex-direction:column;gap:14px}
.cl-stat-num{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--brand);line-height:1.15}
.cl-stat-label{display:block;font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap}
.cl-crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);margin-bottom:18px}
.cl-crumb a{color:var(--text-3);text-decoration:none}
.cl-crumb a:hover{color:var(--brand)}
.cl-crumb .sep{color:var(--text-3)}   /* v1.1.3（续 9）：原为 var(--border)（#e5e6eb，白底 1.25:1、深色 1.40:1，几乎不可见）；分隔符改用次级文字色 */
.cl-crumb .cur{color:var(--text-2)}
@media (max-width:900px){ .cl-side{display:none} }
/* v1.1.3（统一主栏左边界）：页面级视图（更新日志 / 自测 / 对比）本就不渲染左栏，
   但主区要落在与目录型视图相同的那条竖线上——补出「内边距 24 + 侧栏 208 + 间距 28」的位置。
   ≥961 才需要补：≤960 时目录型视图的侧栏也是收进抽屉的，两边本来就都从容器内边距起。 */
@media (min-width:961px){ body.is-changelog .catalog-layout{padding-left:260px} }
/* v5（2026-09-26）：回到顶部浮动按钮（列表 / 搜索 / 收藏 / 更新日志视图；详情页有自己的返回链路，不叠加） */
.back-top{position:fixed;right:22px;bottom:26px;z-index:60;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;
  box-shadow:var(--shadow-hover);display:inline-flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .2s,transform .2s,color .15s,border-color .15s}
.back-top:disabled{opacity:0;transform:translateY(8px);pointer-events:none}
.back-top:not(:disabled){opacity:1;transform:none;pointer-events:auto}
.back-top:hover{color:var(--brand);border-color:var(--brand)}
.side-nav{position:sticky;top:calc(var(--nav-h) + 28px);flex:0 0 208px;display:flex;flex-direction:column;gap:4px;
  max-height:calc(100vh - 108px);overflow-y:auto}
.side-title{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.06em;padding:2px 10px 4px}
.side-sep{height:1px;background:var(--border-light);margin:12px 2px}
/* 一级主题：竖排整行按钮。
   v4.1 曾按参考站把主题挪到顶栏下方的横向筛选条，2026-09-19 使用者判定「混乱、不好找」，
   已改回侧栏。原因：参考站主题名短（前端/后端/AI，9 个），我们主题名长（电控与电气架构）、
   数量还多一个，横排就成了标签墙；竖排一行一个才读得下去。 */
.topic-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:8px 12px;border-radius:9px;border:0;border-left:2px solid transparent;background:transparent;
  color:var(--text-2);font-size:14px;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .15s,color .15s,border-color .15s}
.topic-chip:hover{background:var(--bg-hover);color:var(--text)}
.topic-chip.on{background:var(--brand-light);color:var(--brand);font-weight:600}
.topic-chip .cnt{flex:none;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.topic-chip.on .cnt{color:var(--brand)}
/* 二级分类：本主题的分节目录，常驻左栏（这一条是学参考站 .catalog-sidebar > .cat-chips 的） */
.side-cat{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  border:0;border-left:2px solid transparent;background:transparent;color:var(--text-2);
  font-size:13px;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .15s,color .15s,border-color .15s}
.side-cat:hover{background:var(--bg-hover);color:var(--text)}
.side-cat.on{background:var(--brand-light);color:var(--brand);font-weight:600;border-left-color:var(--brand)}
.side-cat .cnt{margin-left:auto;flex:none;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.side-cat.on .cnt{color:var(--brand)}
.main{flex:1;min-width:0}
/* 顶栏收藏：作用于「全站」，性质与搜索相同，所以放在顶栏与搜索同级，不混进主题目录 */
.nav-fav{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;
  border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-2);
  font-size:13px;font-family:inherit;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.nav-fav:hover{border-color:var(--brand);color:var(--brand)}
.nav-fav.on{border-color:var(--brand);background:var(--brand-light);color:var(--brand);font-weight:600}
.nav-fav svg{width:15px;height:15px;flex:none}
.nav-fav .cnt{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.nav-fav.on .cnt{color:var(--brand)}

/* ---------- 主题视图 ---------- */
.topic-heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.topic-heading h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.topic-heading .cnt{font-size:13px;color:var(--text-3)}
/* v4.1：吸顶只剩顶栏 60，锚点跳转留 88px 即可不被遮 */
.cat-section{margin-bottom:40px;scroll-margin-top:calc(var(--nav-h) + 28px)}
.cat-section h2{display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:650;color:var(--text-2);margin-bottom:16px}
.cat-section h2 .cnt{font-size:12px;color:var(--text-3);font-weight:400}
/* v4.1：分节标题英文副题（CATEGORIES[].nameEn 有值才渲染，分隔点由 CSS 补） */
.cat-section h2 .sec-en{font-style:normal;font-size:12.5px;font-weight:400;color:var(--text-3)}
.cat-section h2 .sec-en:before{content:"· ";color:var(--text-3)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.empty-tip{padding:60px 20px;text-align:center;color:var(--text-3);font-size:14px}

/* ---------- 更新日志视图（v5 · 2026-09-26 工程线任务书①，方案 A）----------
   对齐参考站 changelog 形态：单列按日期倒序；每条 = 日期（里程碑带版本徽章）+
   标题 + 用户视角明细 + 「收录新词汇」直达卡。全部用 CSS 变量着色，明暗主题自适应 */
/* 时间轴形态（对齐参考站 changelog-timeline：左轨道线 + 节点圆点 + 日期在轨侧，条目体右侧流式） */
.cl-list{position:relative}
.cl-list:before{content:"";position:absolute;left:5px;top:10px;bottom:14px;width:2px;
  background:var(--border-light);border-radius:2px}
.cl-list.single:before{display:none}   /* v1.1.3：只有一条动态时不画时间轴线（单节点没有"连线"可连） */
.cl-entry{position:relative;display:flex;gap:16px;padding:0 0 34px;scroll-margin-top:calc(var(--nav-h) + 28px)}
.cl-entry:last-child{padding-bottom:6px}
.cl-meta{flex:0 0 122px;display:flex;align-items:flex-start;gap:10px}
.cl-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--surface);
  border:2.5px solid var(--brand);position:relative;z-index:1;margin-top:3px}
.cl-meta-txt{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.cl-date{font-size:12.5px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;line-height:1.4}
.cl-ver{align-self:flex-start;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-light);
  border:1px solid var(--brand);border-radius:999px;padding:0 8px;line-height:1.7}
.cl-body{flex:1;min-width:0}
.cl-subtitle{margin:-14px 0 24px;font-size:13.5px;color:var(--text-3);line-height:1.7}
/* 分类筛选条（对齐参考站 changelog-filter-group：is-active 高亮 + 滑动指示器） */
.cl-filter{position:relative;display:inline-flex;gap:4px;background:var(--bg-soft);border:1px solid var(--border-light);
  border-radius:10px;padding:4px;margin:0 0 30px}
.cl-filter-ind{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow-card);transition:left .22s var(--ease),width .22s var(--ease);opacity:0}
.cl-filter-btn{position:relative;z-index:1;border:0;background:transparent;padding:6px 14px;border-radius:8px;
  font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:color .15s}
.cl-filter-btn.is-active{color:var(--brand);font-weight:600}
.cl-filter-btn:not(.is-active):hover{color:var(--text)}
@media (max-width:640px){
  .cl-entry{flex-direction:column;gap:10px}
  .cl-meta{flex:none;align-items:center}
}
.cl-title{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--text);margin:0 0 10px}
.cl-items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.cl-items li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.75;color:var(--text-2)}
.cl-items li:before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;
  border-radius:50%;background:var(--brand);opacity:.85}
.cl-terms-head{margin-top:16px;font-size:12.5px;font-weight:600;color:var(--text-3)}
.cl-terms{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.cl-term{display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;
  background:var(--bg-soft);border:1px solid var(--border-light);border-radius:9px;
  padding:5px 11px;transition:border-color .15s,background .15s,transform .15s}
.cl-term:hover{border-color:var(--brand);background:var(--brand-light);transform:translateY(-1px)}
.cl-term b{font-size:13px;font-weight:600;color:var(--text)}
.cl-term i{font-style:normal;font-size:11.5px;color:var(--text-3)}
.cl-term em{font-style:normal;font-size:10.5px;color:var(--text-3);border:1px solid var(--border-light);
  border-radius:999px;padding:0 6px;line-height:1.6;background:var(--surface)}
.cl-term:hover b{color:var(--brand)}

/* ============================================================
   v5（2026-09-27 体验批次）新增部件：
   ① 自绘下拉（自测选主题 / 详情页选对比词条共用，样张 §3 定稿形态）
   ② 闪卡自测视图（样张 §1 定稿形态）
   ③ 示意图放大镜（样张 §2 定稿参数；关闭钮 32px/14px 图标）
   ④ 词条并排对比（样张 §3 定稿形态；vs 胶囊列宽 44px）
   ⑤ Apple Large Title（双元素交叉淡入，只动 opacity——MEMORY §31-6 铁律）
   ============================================================ */
/* ---- ① 自绘下拉 ---- */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;min-width:190px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;padding:7px 12px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,color .15s}
.dd-btn:hover{border-color:var(--brand)}
.dd-btn .t{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-caret{flex:none;width:8px;height:8px;border-right:1.6px solid var(--text-3);border-bottom:1.6px solid var(--text-3);
  transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.dd.open .dd-caret{transform:rotate(225deg) translateY(-1px)}
.dd-list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop-shadow);padding:6px;z-index:20;
  opacity:0;transform:translateY(-4px);visibility:hidden;pointer-events:none;
  transition:opacity .12s ease-out,transform .12s ease-out,visibility .12s}
.dd.open .dd-list{opacity:1;transform:none;visibility:visible;pointer-events:auto}
.dd-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;
  font-size:13px;color:var(--text-2);cursor:pointer}
.dd-item:hover{background:var(--bg-hover);color:var(--text)}
.dd-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item small{color:var(--text-3);font-size:11px;flex:none;max-width:96px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dd-item .ck{opacity:0;color:var(--brand);font-size:12px;font-weight:700;flex:none}
.dd-item.on{color:var(--brand);background:var(--brand-light)}
.dd-item.on .ck{opacity:1}

/* ---- ② 闪卡自测 ---- */
.practice-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.practice-tip{font-size:12.5px;color:var(--text-3);line-height:1.6;flex:1 1 260px;min-width:0}
.flash-stage{perspective:1200px;max-width:560px;margin:0 auto}
.flash-card{position:relative;width:100%;height:260px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);outline:none;border:0;padding:0;
  background:transparent;font-family:inherit}
.flash-card:focus-visible{outline:2px solid var(--brand);outline-offset:6px;border-radius:16px}
.flash-card.flip{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--border);border-radius:16px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
  box-shadow:0 1px 2px rgba(29,33,41,.05)}
.flash-face.back{transform:rotateY(180deg);background:var(--bg-soft)}
.flash-face .hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text-3)}
.flash-face .term{font-size:30px;font-weight:700;letter-spacing:-.3px}
.flash-face .en{font-size:13px;color:var(--text-3);margin-top:6px}
.flash-face .line{font-size:16px;line-height:1.8;color:var(--text)}
.flash-face .src{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:var(--text-3)}
.flash-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.flash-ctrl .judge{border:1px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--text-2);font-size:13px;padding:8px 22px;cursor:pointer;font-family:inherit}
.flash-ctrl .judge.yes:hover{color:#15803d;border-color:#15803d;background:rgba(21,128,61,.08)}
.flash-ctrl .judge.no:hover{color:#cf222e;border-color:#cf222e;background:rgba(207,34,46,.08)}
.flash-ctrl .judge:disabled{visibility:hidden}   /* v1.1.3：翻面前不摆两枚灰按钮（原来 opacity:.35 看着像坏的）；留位不跳动，翻面后出现 */
.flash-count{text-align:center;font-size:12px;color:var(--text-3);margin-top:8px;font-variant-numeric:tabular-nums}
.flash-dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.flash-dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}

/* ---- ③ 示意图放大镜 ---- */
/* 详情页 demo 包装：默认限宽 420（与 SVG 图解口径一致），demoCtl 等宽内容挂 zoomable-wide 走 640 */
.zoomable{position:relative;width:100%;max-width:420px;margin:0 auto;outline:none}
/* v5（2026-09-27）：zoom-in 特例已删——光标形态按使用者拍板统一为「箭头 + 圆环」两种，
   .zoomable 带 role=button 自然落进圆环规则 */
.zoomable.zoomable-wide{max-width:640px}
.zoomable:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:12px}
/* v5（2026-09-27 返工）：.zoom-tag 角标样式已随功能整体删除（使用者反馈嫌多余、影响美观） */
/* 放大遮罩（定稿参数：遮罩 padding 4vh/4vw，白卡 14px 圆角 padding 20px；关闭钮 32px 圆 + 14px 叉图标） */
.zoom-mask{position:fixed;inset:0;z-index:85;background:var(--mask);
  display:flex;align-items:center;justify-content:center;padding:4vh 4vw;cursor:zoom-out}
.zoom-mask[hidden]{display:none}
/* 白卡定宽：放大图 width:100% 需要确定的参照宽度（flex 收缩套内百分比会塌回 SVG 固有 300px，实测教训） */
.zoom-big{background:var(--surface);border-radius:14px;padding:20px;width:min(88vw,880px);max-width:96vw;position:relative}
.zoom-big-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:0;border-radius:50%;
  background:var(--bg-hover);color:var(--text-3);cursor:pointer;padding:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,transform .15s}
.zoom-big-x:hover{background:var(--bg-soft);color:var(--text);transform:scale(1.08)}
.zoom-big-x svg{width:14px;height:14px;display:block}
.zoom-big .zoomable{cursor:default;max-width:none}
/* 放大态里放开内联 max-width:420 的限制（!important 压内联样式）；
   选择器只走 #zoomBody，不碰 .zoom-big-x 的叉图标 SVG（样张 .big svg 误伤教训） */
#zoomBody svg{width:100%!important;max-width:min(88vw,880px)!important;height:auto!important}

/* ---- ⑤ Apple Large Title（主题视图）----
   双元素交叉淡入：大标题在正文流里自然滚走；钉顶小标题按滚动进度淡入接位。
   只动 opacity（GPU 合成）；禁 font-size/padding 过渡（逐帧重排，实测卡顿）。
   .lt-small 是 #topicView 的直接子元素（sticky 约束盒 = 视图容器，才能钉住整个列表时长），
   负下边距抵消它占的流高度；z-index 5 + 背景 var(--bg) 让它在接位时盖住滚过的大标题。
   v5（2026-09-27 返工）：**不挂 CSS transition**——滚动每帧重设 opacity 目标值时，过渡会不停
   retarget，动画永远在「追」滚动（发黏、拖沓，使用者实测否掉的就是这个体感）。改为滚动进度
   直接驱动 + 16px 短行程：慢滚平滑渐入、快滚一帧到位，零迟滞 */
.lt-big-h h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.lt-big-h small{display:block;font-size:12px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-top:4px}
.lt-small{position:sticky;top:var(--nav-h);z-index:5;margin:0 0 -46px;padding:8px 0 10px;background:var(--bg);
  opacity:0;pointer-events:none}
.lt-small h1{font-size:15px;font-weight:650;letter-spacing:-.01em}

/* ---- ⑥ 全站自定义光标（2026-09-27 第五次修订：JS 跟随层，完全照搬参考站 cursor-fx 机制） ----
   §8-6 效果优先例外留痕：JS 跟随层此前被否决为性能红线；data-uri 静态光标经四轮参数逼近
   （画布 26→24 / 填充 12→8% / 描边 1.5→1.25）使用者并排对比仍判与参考站不一致——根源是浏览器
   对「图片光标」的光栅化与正常 DOM 渲染（抗锯齿/颜色混合）存在机制差距，参数无法桥接。
   本版依使用者拍板解锁跟随层，照参考站原机制实施：隐藏系统光标 + DOM 元素跟随鼠标。
   性能用合规写法守住：rAF 合帧 + translate3d（GPU 合成），全程只动 transform/opacity——
   恰为动效红线唯一允许的属性。如何切回合规 data-uri 方案：删除本 CSS 块 + 尾部跟随层 DOM
   与 JS（搜 cursorFx），从 git 历史恢复 data-uri 版（2026-09-27 之前的提交）。 */
html.has-cursor-fx, html.has-cursor-fx *{cursor:none!important}   /* 参考站同款：全局隐藏系统光标 */
.cursor-fx{position:fixed;left:0;top:0;width:22px;height:22px;z-index:99999;pointer-events:none;opacity:0}
html.has-cursor-fx .cursor-fx{will-change:transform}
.cursor-fx.on{opacity:1}   /* 首次鼠标移动才现身（参考站同款出场节奏） */
/* 箭头：参考站原始 SVG（viewBox 24 按 22 渲染），margin -4/-3 把热点 (4,3) 对到鼠标点；
   白描边 + 品牌填充走正常 DOM 渲染管线——与参考站视觉一致性的根基 */
.cursor-fx .cf-arrow{display:block;margin:-3px 0 0 -4px;transform-origin:4px 3px}
.cursor-fx .cf-arrow, .cursor-fx .cf-ring{transition:opacity .12s ease-out,transform .12s ease-out}
.cursor-fx .cf-arrow path{fill:var(--brand);stroke:#fff;stroke-width:2.2;stroke-linejoin:round;paint-order:stroke}
/* 圆环：参考站原值（22px、1.5px 描边、12% 填充、圆心即热点）——上一轮减淡到 8%/1.25px 是
   data-uri 渲染观感的妥协，渲染机制现已一致，直接用原值；color-mix 跟随八色主题（参考站同款写法） */
.cursor-fx .cf-ring{position:absolute;left:0;top:0;display:block;box-sizing:border-box;width:22px;height:22px;
  margin:-11px 0 0 -11px;border-radius:50%;background:color-mix(in srgb,var(--brand) 12%,transparent);
  border:1.5px solid var(--brand);opacity:0;transform:scale(.5)}
/* 变形动画：箭头 ⇄ 圆环交叉缩放淡入淡出（.12s ease-out，只动 opacity/transform）——静态光标原理上做不出 */
.cursor-fx.is-link .cf-arrow{opacity:0;transform:scale(.5)}
.cursor-fx.is-link .cf-ring{opacity:1;transform:scale(1)}
@media print{.cursor-fx{display:none}}

/* ---- ⑦ 打印样式（件 5，样张 @media print 移植并适配站点类名）----
   界面件全部退场，正文白底黑字 12pt；闪卡静态化（正反面上下并排）；成块内容不跨页截断 */
@media print{
  .nav,.resume-bar,.debug-report,.debug-list,.back-top,.page-toc,.entry-nav,.toast,
  .detail-topbar,.pron-btn,.favorite-button,.tbtn,.cmp-dd-host,.zoom-mask,.lt-small,
  .dd,.practice-head,.cl-filter,.cl-side,.cl-crumb,.flash-ctrl,.flash-dots,.kbd-btn,
  .drawer-mask,.nav-fav,.nav-color,.lang-sw{display:none!important}
  /* v5（2026-10-01 方案 A）：抽屉工具区（窄屏新增）在打印时同退场——
     否则 A4 纸宽（≈793px）会命中 max-width:960px，留下一道空的分隔线 */
  .drawer-tools{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .catalog-layout{display:block;max-width:none;padding:0}
  a{color:inherit;text-decoration:none}
  .card,.doc-sec,.cl-entry,.detail-section,.dh-quote,.flash-card,.scene-item,.var-card{break-inside:avoid;page-break-inside:avoid}
  .card{box-shadow:none;border-color:#bbb}
  .dh-demo,.card-demo,.doc-sec,.anat-stage,.flash-face.back,.dk-answer{background:#fff}
  .doc-sec,.dh-demo,.card-demo,.anat-stage{border-color:#bbb}
  .flash-stage{perspective:none;max-width:100%}
  .flash-card{height:auto;transform:none!important;cursor:default}
  .flash-face{position:static;backface-visibility:visible;transform:none;box-shadow:none;
    border-color:#bbb;height:auto;min-height:0;padding:12px 16px;text-align:left}
  .flash-face .hint,.flash-face .src{display:none}
  .flash-face .term{font-size:16pt}
  .flash-face.back{background:#f2f2f2}
}


/* ---------- 卡片 ---------- */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius);padding:20px 20px 16px;box-shadow:var(--shadow-card);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
  cursor:pointer;position:relative;
  /* v5（2026-10-02 多端适配·件 2）：卡片作为「尺寸容器」，供下方 @container 按卡片自身宽度取数
     （用来给放不下的卡片示意图降档缩放）。命名容器，避免与其它潜在的匿名容器冲突。 */
  container-type:inline-size;container-name:termcard}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border)}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-title{flex:1;min-width:0}
/* v5（2026-09-27 标题样式转正·方案 C 参考站同款，使用者拍板）：① 修复历史失配 bug——
   原选择器写成 .card-title h3（card-title 内部的 h3），但 card-title 类实际挂在 h3 自身
   （v4 标题改真链接时结构变了、CSS 没跟上），两条规则自重构以来从未生效，线上一直是
   浏览器默认 h3（约 17.55px/700、英文未弱化）；② 参数按参考站首页 computed 实测落地
   （2026-09-27 三卡实测，浅色主题）：中文 22px/600（clamp 流式，375 宽视口约 18.75px）+
   英文 17px/500/品牌蓝 var(--brand)（明暗八色自动跟随）/左距 6px；英文颜色首轮曾被静态
   分析误判为灰色，经 computed 实测纠正——CSS 级联以实测为准（教训记 MEMORY §32-16）。
   ≤720px 为参考站同款标题断点（仅缩英文 16px；中文由 clamp 自动缩），非站内布局断点 */
h3.card-title{font-size:clamp(17px,4.4vw,18px);font-weight:600;letter-spacing:-.01em;color:var(--text);line-height:1.7}   /* v1.1.3：22px → 18px，理顺「页题 28 > 区块题 17 > 卡片题 18」的阶梯（原来卡片题比区块题还大） */
h3.card-title span{display:inline-block;font-size:14px;font-weight:500;color:var(--brand);margin-left:6px}   /* v1.1.3：inline-block 让英文名整体换行；字号 17 → 14，不抢主名 */
@media (max-width:720px){
  h3.card-title span{font-size:16px}
}
/* v4：卡片标题改真链接——消除 role=button 内嵌按钮，键盘与右键新标签均可用 */
.card-link{display:inline-block;color:inherit;text-decoration:none}
.card-link:hover{color:var(--brand)}
.favorite-button{flex:none;width:30px;height:30px;border:0;background:transparent;border-radius:8px;
  color:var(--gray-6);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s}
.favorite-button:hover{background:var(--bg-hover);color:var(--brand)}
.favorite-button.on{color:#f7ba2a}
.favorite-button svg{width:17px;height:17px}
.card-quote{margin-top:10px;font-size:13.5px;color:var(--text-2);line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 缩放画布（示意插图容器） ----------
   卡片示意区：内容按 400×225 的大画布制作，再整体缩放 0.75，
   小卡片里也能放下高保真的拟真 UI（原站核心技术） */
.card-demo{--pv-w:400px;--pv-h:225px;--pv-s:.75;position:relative;flex:1 1 auto;
  aspect-ratio:16/9;margin-top:14px;padding:16px;overflow:hidden;
  background:var(--bg-soft);border:1px solid var(--border-light);border-radius:10px}
/* v5（2026-10-02 多端适配·件 2）：窄卡片里的示意图会被裁。
   根因：上面那套「400×225 整体缩放 .75」把缩放系数写死（画布恒为 300px 宽）且没有下限保护，
   卡片内宽不足 300px 时画布两侧被裁——实测 320（裁 28）/ 360（8）/ 375（1）/ 961（7）/ 1281（13）五档中招。
   修法：按「卡片自身宽度」把画布降档（容器查询，容器名字 termcard 挂在 .card 上）。
   为什么不用视口断点：桌面两列时卡片比视口窄得多——961 / 1281 两档正是这么漏掉的。
   阈值 302px 的来路：容器查询读的是 .card 的「内容宽」（= 卡片总宽 − 42：左右 padding 40 + 边框 2），
   而示意图容器的内宽 = 卡片总宽 − 44 ⇒ 内宽 = 内容宽 − 2。故内容宽 < 302px 时才真会裁。
   降档后画布 232px，最窄的 320 档（卡片 288 → 内容宽 246）也放得下。
   实测命中档位：320 / 360 / 375 / 961 / 1281（正是原先被裁的五档）；390 起与 1024 / 1180 / 1440 保持原尺寸。 */
@container termcard (max-width:302px){ .card-demo{--pv-s:.58} }
/* v1.1.3：卡片位示意图的可读性。缩略图整体缩放 0.58–0.75，图内 10–12px 的小字落到 6–9px，
   等于白写——所以卡片位**只留主干**：次要小字（<small>）不显示，主标签加大一号，
   缩放后约 9–13px，能看清「哪几个块、什么顺序」。详情页的同一张图不受影响（选择器限定在 .card-demo）。 */
.card-demo small{display:none}
.card-demo .dk-stage b,.card-demo .dk-col>b,.card-demo .dk-card b{font-size:16px}
.card-demo .dk-arr code{font-size:14px}
.dk-canvas{position:absolute;left:50%;top:50%;width:var(--pv-w);height:var(--pv-h);
  transform:translate(-50%,-50%) scale(var(--pv-s));transform-origin:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  overflow:hidden;pointer-events:none}
.card-demo:empty{display:none}

.mk-btn.text{color:var(--brand);padding:3px 4px}
.mk-link{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.mk-input{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:4px 8px;min-width:104px;color:var(--text);font-size:12px}
.mk-input em{color:var(--text-3);font-style:normal}
.mk-input.focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light)}
.mk-textarea{padding:6px 8px;width:100%;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.mk-select,.mk-textarea{background:var(--surface);border:1px solid var(--border);border-radius:4px;font-size:12px}
.mk-select{display:inline-flex;align-items:center;gap:8px;padding:4px 8px;color:var(--text)}
.mk-caret{width:6px;height:6px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);
  transform:rotate(45deg) translateY(-2px)}
.mk-drop{background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--pop-shadow);
  display:flex;flex-direction:column;width:130px;padding:4px}
.mk-opt{padding:4px 8px;border-radius:4px;font-size:12px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-opt.on{background:var(--brand-light);color:var(--brand)}
.mk-switch{width:30px;height:17px;border-radius:999px;flex:none;background:var(--gray-6);position:relative;display:inline-block}
.mk-switch i{position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff}
.mk-switch.on{background:var(--brand)}
.mk-switch.on i{left:15px}
.mk-choice{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.mk-box{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--gray-6);background:var(--surface);position:relative;flex:none}
.mk-box.on{background:var(--brand);border-color:var(--brand)}
.mk-box.on:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:7px;box-sizing:border-box;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:translate(-50%,-60%) rotate(45deg);transform-origin:center}
.mk-radio{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--gray-6);background:var(--surface);position:relative;flex:none}
.mk-radio.on{border-color:var(--brand)}
.mk-radio.on:after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--brand)}
.mk-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);width:100%}
.mk-tab{padding:3px 8px;color:var(--text-3);border-bottom:2px solid transparent;font-size:12px;white-space:nowrap}
.mk-tab.on{color:var(--brand);border-color:var(--brand)}
.mk-tag{padding:1px 7px;border-radius:3px;font-size:12px;white-space:nowrap}
.mk-tag.blue{color:var(--brand);background:var(--brand-light)}
.mk-tag.green{color:var(--green);background:var(--green-light)}
.mk-tag.red{color:var(--red);background:var(--red-light)}
.mk-tag.orange{color:var(--orange);background:var(--orange-light)}
.mk-tag.gray{color:var(--text-2);background:var(--bg-hover)}
.mk-toast{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  border-radius:5px;padding:4px 10px;box-shadow:var(--pop-shadow);font-size:12px;color:var(--text);white-space:nowrap}
.mk-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.mk-dot.red{background:var(--red)}
.mk-scene{position:relative;width:100%;height:88px;border-radius:6px;overflow:hidden;background:var(--surface);
  border:1px solid var(--border-light)}
.mk-scene.tall{height:110px}
.mk-skel{padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.mk-mask,.mk-skel{position:absolute;inset:0}
.mk-mask{background:var(--mask)}
.mk-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;background:var(--surface);
  border-radius:6px;padding:8px 10px;box-shadow:var(--pop-shadow);
  display:flex;flex-direction:column;gap:5px}
.mk-modal .m-title{font-size:12px;font-weight:600;color:var(--text)}
.mk-modal .m-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:2px}
.mk-modal .m-actions .mk-btn{padding:2px 7px;font-size:12px}
.mk-toast-float{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:2}
.mk-notif{position:absolute;top:8px;right:8px;width:66%;background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:7px 9px;box-shadow:var(--pop-shadow);
  display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2)}
.mk-notif b{font-size:12px;color:var(--text)}
.mk-alert{gap:6px;width:100%;background:var(--red-light);border:1px solid var(--red-border);border-radius:5px;
  padding:5px 9px;font-size:12px;color:var(--red)}
.mk-alert,.mk-steps{display:flex;align-items:center}
.mk-steps{gap:4px}
.mk-step{gap:4px;color:var(--text-3)}
.mk-step,.mk-step i{display:flex;align-items:center;font-size:12px}
.mk-step i{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid var(--gray-6);background:var(--surface);
  justify-content:center;font-style:normal}
.mk-step.on{color:var(--brand)}
.mk-step.on i{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.mk-step-bar{width:16px;height:1.5px;background:var(--border)}
.mk-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand-light);
  border-top-color:var(--brand);animation:mk-spin .8s linear infinite}
@keyframes mk-spin{to{transform:rotate(360deg)}}
.mk-progress{width:100%;height:5px;border-radius:99px;background:var(--gray-5);overflow:hidden}
.mk-progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mk-progress.stuck i{background:var(--gray-6)}
.mk-donut{width:36px;height:36px;flex:none;background:conic-gradient(var(--brand) 0 66%,var(--gray-5) 66% 100%)}
.mk-donut,.mk-donut i{border-radius:50%;display:flex;align-items:center;justify-content:center}
.mk-donut i{width:22px;height:22px;background:var(--bg-soft);font-size:11px;color:var(--text-2);font-style:normal}
.mk-tip-wrap{position:relative;display:inline-flex}
.mk-tip-bubble{bottom:calc(100% + 5px);background:var(--text);color:var(--bg);font-size:12px;
  padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:2}
.mk-tip-bubble,.mk-tip-bubble:after{position:absolute;left:50%;transform:translateX(-50%)}
.mk-tip-bubble:after{content:"";top:100%;border:3.5px solid transparent;border-top:3.5px solid var(--text)}
.mk-icon-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px}
.mk-popover{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);width:130px;
  border:1px solid var(--border);border-radius:6px;box-shadow:var(--pop-shadow);
  padding:7px 8px;z-index:2;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.mk-phone{width:44px;height:76px;border:2px solid var(--text-3);border-radius:8px;padding:6px 5px;
  background:var(--surface);display:flex;flex-direction:column;gap:4px}
.mk-truncate{max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface);
  border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--text)}

/* ---- 内容积木：文件行 ---- */
.dk-files{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;
  display:flex;flex-direction:column;gap:2px;text-align:left}
.dk-file{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:12px}
.dk-file .f-ico{width:22px;height:22px;border-radius:6px;background:var(--brand-light);color:var(--brand);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}
.dk-file .f-name{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-file .f-note{color:var(--text-3);font-size:11px;margin-left:auto;white-space:nowrap}
.dk-file .f-check{flex:none;width:16px;height:16px;border-radius:50%;background:var(--green-light);
  color:var(--green);font-size:10px;display:inline-flex;align-items:center;justify-content:center}

/* ---- 内容积木：diff 视图 ---- */
.dk-diff{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  font-family:var(--mono);font-size:11.5px;text-align:left}
.dk-diff .d-head{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg-soft);
  border-bottom:1px solid var(--border-light);font-size:11px;color:var(--text-2)}
.dk-diff .d-stat{margin-left:auto}
.dk-diff .d-stat .a{color:var(--diff-add-tx)}
.dk-diff .d-stat .d{color:var(--diff-del-tx)}
.diff-line{display:block;padding:1px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff-add{background:var(--diff-add-bg);color:var(--diff-add-tx)}
.diff-del{background:var(--diff-del-bg);color:var(--diff-del-tx)}
.diff-ctx{color:var(--text-3)}
.diff-hunk{background:var(--diff-hunk-bg);color:var(--diff-hunk-tx)}

/* ---- 内容积木：聊天气泡 ---- */
.dk-chat{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;
  display:flex;flex-direction:column;gap:8px;text-align:left}
.dk-chat .c-row{display:flex;gap:8px;align-items:flex-start}
.dk-chat .c-row.me{flex-direction:row-reverse}
.dk-chat .c-ava{width:24px;height:24px;border-radius:50%;background:var(--brand-light);color:var(--brand);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.dk-chat .c-row.me .c-ava{background:var(--green-light);color:var(--green)}
.dk-chat .c-bubble{max-width:78%;background:var(--bg-soft);border-radius:10px;padding:6px 10px;
  font-size:12px;color:var(--text-2);line-height:1.5}
.dk-chat .c-row.me .c-bubble{background:var(--brand);color:var(--on-brand)}
.dk-chat .c-input{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;
  padding:5px 12px;font-size:11px;color:var(--text-3)}

/* ---- 内容积木：提交行 ---- */
.dk-commit{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-family:var(--mono);font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;text-align:left}
.dk-commit .ava{width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,#7c5ce0,#3867e8);flex:none}
.dk-commit .msg{color:var(--text);font-weight:600}
.dk-commit .meta{color:var(--text-3)}
.dk-commit .hash{color:var(--anat-mark);margin-left:auto}

/* ---- 内容积木：流程图（盒子+箭头） ---- */
.dk-flow{display:flex;align-items:stretch;gap:4px;width:100%;flex-wrap:wrap;justify-content:center}
.dk-stage{flex:1 1 0;min-width:64px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.dk-stage b{font-size:12.5px;font-weight:650;color:var(--text-2);white-space:nowrap}
.dk-stage small{font-size:11px;color:var(--text-3);line-height:1.35}
.dk-stage.on{border-color:var(--brand);background:var(--brand-light)}
.dk-stage.on b{color:var(--brand)}
.dk-stage.on small{color:var(--brand-hover)}
.dk-stage.green{border-color:var(--green-border);background:var(--green-light)}
.dk-stage.green b{color:var(--green-deep)}
.dk-arr{flex:none;align-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;
  color:var(--gray-4);font-size:13px;line-height:1.15}
.dk-arr code{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.dk-arr.on{color:var(--brand);font-weight:700}
.dk-arr.on code{color:var(--brand)}
.dk-cols{display:flex;gap:8px;width:100%}
.dk-col{flex:1 1 0;min-width:0;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
  padding:9px 10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.dk-col>b{font-size:11.5px;font-weight:650;color:var(--text-2)}
.dk-col small{font-size:11px;color:var(--text-3);line-height:1.5}
.dk-col.on{border-color:var(--brand);background:var(--brand-light)}
.dk-col.green{border-color:var(--green-border);background:var(--green-light)}
.dk-col.red{border-color:var(--red-border);background:var(--red-light)}
.dk-cmd{background:#1f2430;border-radius:8px;padding:8px 12px;font:12px/1.5 var(--mono);color:#d7dae0;
  white-space:nowrap;overflow-x:auto;width:100%;text-align:left}
.dk-cmd b{color:#8b93a5;font-weight:400;margin-right:6px}
.dk-cmd .hl{color:#7ee787}

/* ---- 内容积木：节点图（分支/泳道） ---- */
.dk-graph{display:flex;flex-direction:column;gap:7px;width:100%;text-align:left}
.dk-lane{display:flex;align-items:center;min-width:0}
.dk-gtag{flex:none;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--brand-light);
  color:var(--brand);margin-right:6px;font-family:var(--mono)}
.dk-gtag.green{background:var(--green-chip-bg);color:var(--green-chip-tx)}
.dk-gtag.gray{color:var(--text-3);background:var(--bg-soft)}
.dk-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--brand-light)}
.dk-dot.green{background:var(--green);box-shadow:0 0 0 2px var(--green-chip-bg)}
.dk-dot.red{background:var(--red);box-shadow:0 0 0 2px var(--red-light)}
.dk-dot.merge{background:var(--purple);box-shadow:0 0 0 3px var(--purple-light)}
.dk-glink{flex:1;min-width:6px;max-width:26px;height:2px;background:var(--border)}
.dk-gnote{font-size:12px;color:var(--text-3);margin-left:6px}

/* ---- 故事积木：卡 → 动作 → 卡（一句话图解） ---- */
.dk-story{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;width:100%}
.dk-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  display:flex;flex-direction:column;gap:4px;min-width:112px;max-width:200px;text-align:center;
  box-shadow:var(--shadow-card)}
.dk-card b{font-size:12.5px;color:var(--text);font-weight:650;white-space:nowrap}
.dk-card small{font-size:10.5px;color:var(--text-3);line-height:1.4}
.dk-dots{display:flex;gap:4px;justify-content:center;margin-top:2px}
.dk-dots i{width:7px;height:7px;border-radius:50%;background:var(--gray-5)}
.dk-dots i.on{background:var(--brand)}
.dk-dots i.new{background:var(--green);box-shadow:0 0 0 2px var(--green-light)}
.dk-avas{display:flex;gap:3px;justify-content:center;margin-top:3px}
.dk-avas i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;
  background:linear-gradient(135deg,#3867e8,#7c5ce0)}
.dk-avas i:nth-child(2){background:linear-gradient(135deg,#00b42a,#22c55e)}
.dk-avas i:nth-child(3){background:linear-gradient(135deg,#ff7d00,#fbbf24)}
.dk-move{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
.dk-move span{font-size:10.5px;color:var(--brand);font-weight:600;white-space:nowrap}
.dk-move i{font-style:normal;color:var(--brand);font-size:17px;line-height:1}
.dk-answer{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--border-light);
  padding-top:12px;width:100%}
.dk-answer b{flex:none;color:var(--brand);font-size:13px}
.dk-answer p{color:var(--text-2);font-size:13px;line-height:1.7}

/* ============================================================
   词条详情视图
   ============================================================ */
/* v4.1：详情页收窄成居中一栏（对齐参考站 .detail{max-width:920px}）。
   两个作用：一行的汉字不宜过长；收窄后两侧才有空档给上下条浮标贴（见 .float-nav）。 */
#termView{max-width:900px;margin:0}   /* v1.1.3：原来 margin:0 auto 让正文在 996px 主栏里居中、左边界比卡片流右移 48px；改为靠左，与列表同一竖线 */
/* v4.1：详情页顶栏吸顶（对齐参考站 .detail-topbar），滚过 8px 后出现下边框 */
.detail-topbar{position:sticky;top:var(--nav-h);z-index:45;display:flex;align-items:center;gap:12px;
  padding:10px 12px;margin:0 -12px 16px;flex-wrap:wrap;
  background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s var(--ease)}
.detail-topbar.is-stuck{border-bottom-color:var(--border-light)}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;
  padding:6px 14px;font-size:13px;color:var(--text-2);background:var(--surface);cursor:pointer;
  transition:border-color .15s,color .15s}
.back-btn:hover{border-color:var(--brand);color:var(--brand)}
.crumb{font-size:13px;color:var(--text-3)}
.crumb b{color:var(--text-2);font-weight:500}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.topbar-actions .favorite-button{width:32px;height:32px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.topbar-actions .favorite-button:hover{background:var(--bg-hover)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:9px;
  padding:6px 12px;font-size:12.5px;color:var(--text-2);background:var(--surface);cursor:pointer;
  transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}
/* v4 删除：.tbtn.faved 是死样式（toggleFav 只切 .on，从不加 faved） */

/* ---- v5：界面语言折叠菜单（对齐参考站 nav-language 形态；弹出层与主题色菜单共用同规格，见下方合并选择器） ---- */
.lang-sw{position:relative;flex:none}
.lang-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;
  border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-2);
  font-size:13px;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s}
.lang-btn:hover{border-color:var(--brand);color:var(--brand)}
.lang-sw.open .lang-btn{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.lang-caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor;opacity:.65;transition:transform .15s}
.lang-sw.open .lang-caret{transform:rotate(180deg)}

/* ---- 上一条 / 下一条（**同一对按钮**，宽屏固定贴正文列、窄屏落回顶栏下方）----
   横向锚点是「正文列的左右边缘」，由 syncFloatAnchor() 量出来写进 --fl-right / --fr-left。
   参考站写的是 calc(50% ± 514px)——它的详情页是居中窄栏，纯 CSS 算得出来；
   我们的正文列在侧栏右边、宽度随视口变，所以只能量。容器的空标签就写在这个节点上。 */
.float-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:40;height:46px;padding:0 16px;
  display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-card);color:var(--text-2);font-size:13px;cursor:pointer;
  /* v5 修复（2026-09-27 报障二·按钮闪烁）：不许写 all——left/right 必须排除在过渡外。
     根因：syncFloatAnchor() 先量正文列 rect（强制布局，此刻 --fl-right/--fr-left 尚未写入，
     按钮按 fallback 16px 定型计算值）后写变量 → 计算值从 16px 跳到锚点值，
     transition:all 把这次跳变播成 0.22s 的滑入动画（真机采样实测 305→1279→1375px 三帧过渡），
     深链刷新即肉眼可见「按钮从屏幕边缘滑进来」。收窄后位置跳变不过渡、直接落位；
     hover 反馈（边框/投影/文字变色）保留过渡。 */
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease),color .22s var(--ease);
  white-space:nowrap;max-width:170px}
.float-nav .fn-arrow{font-size:15px;color:var(--text-3)}
.float-nav .fn-text{overflow:hidden;text-overflow:ellipsis}
.float-nav.left{left:auto;right:var(--fl-right,16px)}
.float-nav.right{left:var(--fr-left,16px);right:auto}
.float-nav:hover{border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-float)}
.float-nav:hover .fn-arrow{color:var(--brand)}
/* ⚠️ .entry-nav 在宽屏下**刻意不给任何样式**（与参考站一致）：它就是个普通块，
   两个 position:fixed 的子元素脱离文档流飘到正文列两侧，容器自身高度为 0。
   只有在窄屏（见「响应式」）它才变成 flex 行。因此**永远只有一对按钮**，
   不存在"两组上下条"——v4.1 初版多复制了一份固定浮标，那是错的。 */

/* ============================================================
   v4.1 · 视图过渡（View Transitions API）
   对齐参考站：morph 是「被点的卡片 ↔ 详情标题」的共享元素动画——
   卡片的长方形长大后变成详情页的标题，所以看起来像"从一个卡片里展开"。
   三条纪律都在 renderApp() 的 JS 里落实，缺一条动画就出不来：
     ① view-transition-name 运行期挂/卸，同一时刻全局唯一（先卸起点再挂终点）
     ② 起点挂完名后读一次 offsetWidth 强制重排，否则浏览器不认起始快照
     ③ 特性检测不通过、或用户开了「减少动态效果」→ 直接切换，功能不受影响
   ============================================================ */
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:vt-fade-in .18s ease-out both}
::view-transition-group(morph){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
/* 列表 → 详情：旧页淡出、新页延迟淡入，标题从卡片位置长大 */
html[data-dir=open]::view-transition-old(root){animation:vt-root-out .18s ease-out both}
html[data-dir=open]::view-transition-new(root){animation:vt-fade-in .3s ease-out .1s both}
::view-transition-new(detail-enter){transform-origin:50% 12%;
  animation:vt-body-in .32s cubic-bezier(.22,1,.36,1) .11s both}
/* 详情 → 上/下一条：只让正文左右滑（参考站是 16vw，这里收到 8vw，连翻多条不晕） */
html[data-dir=next]::view-transition-old(detail-body){animation:vt-out-l .3s var(--ease) both}
html[data-dir=next]::view-transition-new(detail-body){animation:vt-in-r .3s var(--ease) both}
html[data-dir=prev]::view-transition-old(detail-body){animation:vt-out-r .3s var(--ease) both}
html[data-dir=prev]::view-transition-new(detail-body){animation:vt-in-l .3s var(--ease) both}
@keyframes vt-fade-in{0%{opacity:0}}
@keyframes vt-root-out{to{opacity:0}}
@keyframes vt-body-in{0%{opacity:0;transform:translateY(9px) scale(.997)}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-8vw)}}
@keyframes vt-in-r{0%{opacity:0;transform:translateX(8vw)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(8vw)}}
@keyframes vt-in-l{0%{opacity:0;transform:translateX(-8vw)}}

   v2 新增：主题切换 / 卡片渐入 / 搜索高亮 / 流程定位轮播 /
   quiz 重做 / 自检报告 / 焦点环

/* ---- 主题切换按钮（三态：自动 / 浅色 / 深色） ---- */
.theme-btn{flex:none;width:36px;height:36px;border:1px solid var(--border);border-radius:9px;
  background:var(--surface);color:var(--text-2);cursor:pointer;

  transition:border-color .15s,color .15s}

/* ---- v4：主题色切换（对齐原站顶栏「主题色」菜单语义） ---- */
.nav-color{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center}   /* v1.1.3：粗指针档容器被撑到 44px，26px 圆点须居中——否则偏上 9px、左右边距也不等（左 0 右 18），色板浮层 right:0 会跟着偏 18px */
.nav-circle{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--border);
  background:var(--brand);cursor:pointer;transition:transform .15s,border-color .15s}
.nav-circle:hover{transform:scale(1.08);border-color:var(--brand)}
.nav-color.open .nav-circle{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
/* v5（2026-10-01 手机端顶栏溢出修复·方案 A）：控件行内的文字标签。
   只在窄屏抽屉（.drawer-tools）里显示——顶栏形态下必须隐藏，否则会把顶栏重新撑宽。
   文案由 applyLangDom() 按界面语言填（不走 CSS content，保持双语一致）。 */
.dt-label{display:none}
.color-pop,.lang-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:70;min-width:196px;
  display:flex;flex-direction:column;gap:2px;padding:6px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop-shadow)}
.color-pop[hidden],.lang-pop[hidden]{display:none}
.lang-pop{min-width:136px}          /* 语言菜单只有两项，比色板窄 */
.color-pop{right:calc(50% - 13px)}   /* v1.1.3：浮层右缘对齐「圆点」而非 44px 命中区——13px = 圆点半径，粗指针档自动得 9px、细指针档得 0 */
.color-item,.lang-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;
  border:0;border-radius:8px;background:transparent;color:var(--text);font-size:13.5px;
  text-align:left;cursor:pointer;transition:background .12s}
.lang-item{font-family:inherit}
.color-item:hover,.lang-item:hover{background:var(--bg-hover)}
.color-item .dot{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--border)}
.color-item .nm,.lang-item .nm{flex:1;min-width:0}
.color-item .ck,.lang-item .ck{flex:none;font-size:12px;color:var(--brand);visibility:hidden}
.color-item[aria-checked="true"] .nm,.lang-item[aria-checked="true"] .nm{font-weight:600;color:var(--brand)}
.color-item[aria-checked="true"] .ck,.lang-item[aria-checked="true"] .ck{visibility:visible}

/* ---- 仅供读屏的实时播报区（v4：搜索结果计数等） ---- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- 卡片 stagger 渐入（backwards 避免 fill 帧锁住 hover 位移） ---- */
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
.card{animation:cardIn .38s var(--ease) backwards}

/* ---- 搜索关键词高亮 ---- */
mark{background:var(--mark-bg);color:inherit;border-radius:2px;padding:0 1px}

/* ---- 全局搜索结果提示行 ---- */
.search-meta{display:flex;align-items:baseline;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.search-meta h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.search-meta .cnt{font-size:13px;color:var(--text-3)}
.search-meta .scope{font-size:12.5px;color:var(--text-3)}

/* ---- 流程定位轮播（flow 模块） ---- */
.flow-wrap{margin-bottom:40px}
.flow-note{font-size:12.5px;color:var(--text-3);font-weight:400}
/* v5（2026-10-02 空态修复）：原先 .flow-stage 写死 min-height:170px、标签绝对定位钉在左上角，
   而数据侧从不提供 step.mock（全站 66 张卡均无步骤图）→ 退化为「空框里孤零零一个角标」。
   改为：框高随内容走 + 当前步骤作为框内主内容居中（补回走马灯「轮播项承载内容」这一环）。
   日后若补 step.mock，图会接在标签下方，本形态仍成立。 */
.flow-stage{position:relative;background:var(--bg-soft);border:1px solid var(--border-light);
  border-radius:var(--radius);padding:20px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.flow-tag{display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;color:var(--text-2);text-align:center}
.flow-tag b{color:var(--text);font-size:15px;font-weight:600}
.flow-stage .fs-body{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:12px;
  animation:flowFade .3s var(--ease) backwards}
.flow-stage .fs-body:empty{display:none}
@keyframes flowFade{from{opacity:0;transform:translateX(10px)}}
.flow-dots{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.flow-sdot{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;
  cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s}
.flow-sdot:hover{border-color:var(--brand);color:var(--brand)}
.flow-sdot i{font-style:normal;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--gray-6);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.flow-sdot.cur{border-color:var(--brand);background:var(--brand-light);color:var(--brand);font-weight:600}
.flow-sdot.cur i{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.flow-sdot.is-cur-term{position:relative}
.flow-sdot.is-cur-term:after{content:"当前术语在这里";position:absolute;bottom:calc(100% + 5px);left:50%;
  transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:600;color:var(--anat-mark);
  background:var(--anat-bg);border:1px solid var(--anat-mark);border-radius:5px;padding:2px 8px}
/* v5 修复（2026-09-20）：该气泡文案写在 CSS 里，之前英文模式漏翻。
   用 html[lang] 切换（applyLangDom 会同步 documentElement.lang），零 JS 成本。 */
html[lang="en"] .flow-sdot.is-cur-term:after{content:"This term's step"}
.flow-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.flow-nav-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;
  background:var(--surface);color:var(--text-2);font-size:12.5px;padding:5px 14px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,color .15s}
.flow-nav-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.flow-nav-btn:disabled{opacity:.4;cursor:default}
.flow-pos{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}

/* ---- quiz 再试一次（v3 修复 B4：未答题时隐藏，答完才出现） ---- */
.quiz-again{display:none;margin-top:12px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
  padding:5px 14px;font-size:12.5px;color:var(--text-2);cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s}
.quiz-wrap.done .quiz-again{display:inline-flex}
.quiz-again:hover{border-color:var(--brand);color:var(--brand)}

/* ---- 数据自检报告（#debug 开启） ---- */
.debug-report{max-width:1280px;margin:22px auto -6px;padding:0 24px}
.debug-card{border:1px solid var(--green-border);background:var(--green-light);border-radius:12px;
  padding:16px 20px;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:10px}
.debug-card h2{font-size:14px;color:var(--green-deep);font-weight:650}
.debug-card.err{border-color:var(--red-border);background:var(--red-light)}
.debug-card.err h2{color:var(--red)}
.debug-list{max-width:1280px;margin:12px auto 0;padding:0 24px;display:flex;flex-direction:column;gap:6px}
.debug-item{border:1px solid var(--border-light);background:var(--surface);border-radius:9px;
  padding:9px 14px;font-size:12.5px;font-family:var(--mono);color:var(--text-2);display:flex;gap:10px;align-items:baseline}
.debug-item .lv{flex:none;font-weight:700;font-size:11px;border-radius:4px;padding:1px 7px}
.debug-item .lv.err{background:var(--red-light);color:var(--red)}
.debug-item .lv.warn{background:var(--orange-light);color:var(--orange)}
.debug-item b{color:var(--text)}

/* ---- 键盘焦点环（a11y） ---- */
.card-link:focus-visible,.topic-chip:focus-visible,.flow-sdot:focus-visible,.quiz-opt:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px}
.c-ref:focus-visible,.next-chip:focus-visible,.back-btn:focus-visible,.tbtn:focus-visible,

/* ---- 深色模式下深色窗口的描边（避免与背景融为一体） ---- */

html[data-theme="dark"] .dk-cmd{border:1px solid #2b3242}

html[data-theme="dark"] .card:hover{border-color:#333b49}

/* ============================================================
   v3 新增：常见变体 / 可操作演示（demoCtl）/ 演示注解 /

/* 可操作演示的状态说明行（作者用 data-at 按状态切换文案） */

   分类目录改为常驻侧栏，样式见上方「布局」节的 .side-cat ---- */

/* ---- v4：404 推荐出口（对齐原站「回到首页 / 先看看某一条」两个出口） ---- */

/* v4：焦点环覆盖主题色菜单与新增键盘可达元素 */
.card-link:focus-visible,.chip.link:focus-visible,
.nav-circle:focus-visible,.color-item:focus-visible,.nav-brand:focus-visible,
.search-clear:focus-visible,.float-nav:focus-visible,.pron-btn:focus-visible,

/* ---------- 响应式 ---------- */
.drawer-mask{display:none;position:fixed;inset:0;background:var(--mask);z-index:70}
@media (max-width:960px){
  .nav{gap:12px;padding:0 16px}
  /* v1.1.3（续 10）：顶栏导航不再在这里隐藏——隐藏规则移到下面的 @media (max-width:860px)，
     于是 861–960px 顶栏保留「词条 / 自测 / 更新」（实测：861px 搜索框 272px、900–960px 300px，顶栏零溢出）。 */
  .nav-drawer-btn{display:inline-flex}
  /* v4.1 修复：窄屏顶栏横向溢出（v4 在 512px 下右溢 61px，明暗按钮被挤出屏幕外）。
     根因是 .nav-search 不肯缩到 222px 以下——输入框的固有宽度仍在参与 min-content，
     所以除了给容器 min-width:0，还要把输入框自身宽度归零。 */
  .nav-search{flex:0 1 300px;min-width:0}
  .nav-search input{width:0}
  .nav-fav{padding:0 9px}
  .nav-fav span.fav-label{display:none}      /* 窄屏只留星标与计数，省横向空间 */
  .catalog-layout{padding:20px 16px 60px;gap:0}
  .side-nav{display:none;position:fixed;left:0;top:0;bottom:0;z-index:80;width:250px;
    background:var(--surface);border-right:1px solid var(--border-light);padding:18px 14px;overflow-y:auto}
  .side-nav.open{display:flex}
  .drawer-mask.show{display:block}
  .usage-grid{grid-template-columns:1fr}
  .anat-part{flex-wrap:wrap}
  .anat-part .pd{max-width:100%;margin-left:28px;text-align:left;flex-basis:100%}
  .topic-heading h1{font-size:22px}
  .dh-head h1{font-size:24px}
  /* v5（2026-09-27 体验批次·件 6B）：Apple 44px 点击目标——只在移动断点生效，桌面维持现状。
     .nav-links a 在此断点下本就 display:none（导航收进抽屉），触屏主目标 = 抽屉主题项与顶栏按钮 */
  .topic-chip{min-height:44px}
  .cl-side-link{min-height:44px}
  .nav-fav,.theme-btn,.kbd-btn,.nav-drawer-btn,.lang-btn{width:44px;height:44px}
  .lang-btn{width:auto;height:44px;padding:0 10px}   /* v1.1.2 修复：44px 方框把「中文」挤成两行（源项目只修了 ≤560 档，561–960 档漏了） */
  /* v5（2026-10-01 手机端顶栏横向溢出修复·方案 A）——把两个次要控件收进汉堡抽屉。
     背景：上面这条 44px 触控目标规则（2026-09-27「Apple 44px」件）在本断点只放大、未收纳，
     按钮 36→44px 后顶栏固定宽度涨到 446px，超过 360–430px 的手机视口——实测四机型全部横向
     溢出、需左右滑动（顶上这条 432 行内的老注释管的是搜索框，管不到按钮累加）。
     收纳对象 = 快捷键帮助（?）+ 主题色；顶栏保留 汉堡 / 品牌 / 搜索 / 收藏 / 语言 / 明暗。
     控件本体不复制：由 syncHeaderTools() 在断点两侧把 DOM 节点搬进 / 搬出 #drawerTools，
     所以开合、Esc、点外部关闭等既有逻辑一字未改。 */
  .nav>.kbd-btn{display:none}    /* JS 就位前的兜底：先不参与顶栏宽度（主题色在 ≤560 才收，见 syncHeaderTools） */
  .drawer-tools{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding:0 0 10px;
    border-bottom:1px solid var(--border-light)}
  .drawer-tools[hidden]{display:none}
  .drawer-tools .dt-label{display:block;font-size:14px;color:var(--text-2)}
  .drawer-tools .nav-color{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:10px;
    height:44px;padding:0 12px;border-radius:9px}   /* v1.1.3：抽屉里是「圆点 + 主题色」一行，须左对齐，抵消顶栏那条居中 */
  .drawer-tools .nav-circle{width:30px;height:30px}
  .drawer-tools .kbd-ic{width:30px}   /* v1.1.3：与 .drawer-tools .nav-circle 同宽，两行标签左边界对齐 */
  .drawer-tools .kbd-btn{width:100%;height:44px;padding:0 12px;justify-content:flex-start;gap:10px;
    border:0;background:transparent;font-family:inherit;font-size:14px;border-radius:9px}
  .drawer-tools .kbd-btn:hover{background:var(--bg-hover);color:var(--text)}
  /* 色板在抽屉里改为「贴左、铺满抽屉内宽」，避免沿用顶栏的 right:0 后向左溢出抽屉 */
  .drawer-tools .color-pop{right:auto;left:0;top:calc(100% + 6px);min-width:0;width:100%}
  /* v1.1.3：语言控件（≤560 才收进来）——同一套「整行、左对齐、按钮无边框」的抽屉行。
     order:0 是必须的：≤560 那条 .lang-sw{order:8} 在抽屉这个 flex 容器里同样生效，
     会把语言行挤到最下面（实测过），这里按 DOM 原序（语言 → 主题色 → 快捷键）复原。 */
  .drawer-tools .lang-sw{position:relative;order:0;display:flex;align-items:center;height:44px;padding:0 12px;border-radius:9px}
  .drawer-tools .lang-btn{width:100%;height:44px;padding:0 0 0 40px;justify-content:flex-start;gap:10px;
    border:0;background:transparent;font-size:14px;border-radius:9px}   /* 40px = 图标列宽 30 + 间距 10，让「中文」与另两行的标签同一列 */
  .drawer-tools .lang-btn:hover{background:var(--bg-hover);color:var(--text)}
  .drawer-tools .lang-pop{right:auto;left:0;top:calc(100% + 6px);min-width:0;width:100%}
}
/* v5（2026-10-02 多端适配·件 3）：触屏设备（含触屏笔记本）的顶栏控件补到 44px 可点高度。
   问题：2026-09-27 落的「Apple 44px」规则只挂在 ≤960 断点上，于是 961–1440 的触屏平板横屏
   （iPad 1024/1180、Surface 等）落回 33–36px —— 手机上 44、平板反而 33，中间这档没人管。
   修法：改用「指针能力」判断（any-pointer: coarse = 设备存在手指类指针），不再猜宽度区间；
   鼠标设备不命中，桌面观感零变化（any-pointer 比 pointer 更严：触屏笔记本也能覆盖）。 */
@media (any-pointer: coarse){
  .nav-fav,.nav-search,.nav-brand,.nav-color,.theme-btn,.kbd-btn,.nav-drawer-btn,.lang-btn,.nav-links a{min-height:44px}
  .nav-brand,.theme-btn,.kbd-btn,.nav-drawer-btn,.nav-color{min-width:44px}
}
/* v4.1：上下条的两级退化（参考站用 1240 / 1140，我们按自己的列宽算出 1499 / 1319）。
   1499 以下：正文列两侧放不下名字，只留箭头；
   1319 以下：两侧连箭头都放不下 → 同一对按钮落回正文上方，变成一行。 */
@media (max-width:1499px){
  .float-nav .fn-text{display:none}
  .float-nav{padding:0 13px}
}
@media (max-width:1319px){
  .entry-nav{display:flex;gap:10px;margin:14px 0 20px;min-width:0}
  .entry-nav .float-nav{position:static;transform:none;flex:1 1 0;min-width:0;height:auto;min-height:42px;
    padding:8px 12px;white-space:normal;max-width:none;box-shadow:none}
  .entry-nav .float-nav.left{justify-content:flex-start;text-align:left}
  .entry-nav .float-nav.right{justify-content:flex-end;text-align:right}
  /* v1.1.3：只剩一条时（首/末条）不再被 flex:1 1 0 拉满整宽——实测 doc-online 的「下一条」曾占满 900px，
     左端 700px 全空，看着像个坏掉的输入框。只有一条时改为贴合内容，right 侧靠右。 */
  .entry-nav .float-nav:only-child{flex:0 1 auto}
  .entry-nav .float-nav.right:only-child{margin-left:auto}
  .entry-nav .fn-text{display:block;min-width:0;overflow-wrap:anywhere;white-space:normal}
  .entry-nav .fn-arrow{flex:none;font-size:14px}
}
@media (max-width:560px){
  .card-grid{grid-template-columns:1fr}
  .dh-demo{padding:14px}
  /* ============================================================
     v5（2026-10-01 手机端顶栏重排·两行）→ v1.1.3 改为「单行顶栏 + 底部 tab」
     原方案是两行顶栏（行 1 = ☰/品牌/搜索/明暗，行 2 = 导航 + 收藏 + 语言），实测 110px，
     在 667px 视口上占 17%。v1.1.3 的取舍：
       顶栏一行 60px = ☰ · 品牌 · 搜索（占满剩余）· 明暗        ← 就地操作 + 一号动作
       底部固定 tab  = 词条 · 自测 · 更新 · 收藏                  ← 「要去的去处」放拇指区，1 次点击
       主题色 / 语言 / ? 帮助 = ☰ 抽屉                           ← 低频设置项
     为什么不是「三行顶栏」：把三排控件都挂在顶部会占掉视口 23%，而内容站的第一屏要留给词条；
     导航放底部是手机端内容站的通行做法，且不再和收藏/语言抢同一行的宽度。
     顺带修掉两个旧缺口：① .nav-links 在窄屏是 display:none，「自测 / 更新」在手机上原本没有入口；
     ② ≤960 的 44px 规则把 .lang-btn 压成 44px 宽，「中文」被挤成两行。
     （续 10：导航让位给底栏的断点由 ≤960 收到 ≤860——861–960 顶栏放得下导航，实测零溢出。）
     ============================================================ */
  :root{--nav-h:60px}
  .nav{flex-wrap:nowrap;gap:0 8px;padding:8px 12px}
  .nav::before{display:none}      /* 不再换行，两条「撑行」规则一并停用 */
  .nav-drawer-btn{order:1}
  .nav-brand{order:2}
  .nav-brand .brand-stage{display:none}     /* 窄屏只留 logo 图标（参考站手机端同款：只有 vh-logo） */
  /* v1.1.3（续 10）：导航在 861–960 要留在顶栏，必须显式给 order——
     否则 .nav-links / .nav-fav 的默认 order:0 会把它们排到 ☰ 之前。 */
  .nav-links{order:3}
  .nav-search{order:4;flex:1 1 auto;min-width:0;margin-left:0;height:38px;padding:0 10px}
  .nav-fav{order:5}
  .theme-btn{order:6}
  /* v1.1.3：主题色与语言在 ≤560 收进抽屉（见 syncHeaderTools）；顶栏一行放不下它们 */
  .nav>.nav-color{display:none}
  .nav>.lang-sw{display:none}
}
/* ============================================================
   v1.1.3（续 10）：导航与收藏让位给底部 tab 栏的断点由 ≤960 收到 ≤860。
   为什么是 860：实测把导航放回顶栏后，561px 顶栏溢出 38px（明暗按钮被挤出屏幕）、
   600px 搜索框只剩 26px、700px 111px、768px 179px——都不可接受；
   而 861px 起搜索框 272px、900–960px 满 300px，顶栏零溢出。所以 861 是「放得下」的第一档。
   效果：桌面窗口从宽处缩到 861px 的过程中导航一直留在顶栏，只有到手机/平板宽度才交给底栏。
   兜底规则必须写成 .nav> 直接子元素——不然规则会跟着节点进 tab 栏，把 tab 一起藏掉。
   ============================================================ */
@media (max-width:860px){
  .nav>.nav-links,.nav>.nav-fav{display:none}
}
/* ============================================================
   v1.1.3：≤860 的底部 tab 栏（#tabBar 是容器，导航与收藏由 JS 搬进来）
   —— 断点与「顶栏导航隐藏」的断点严格一致：≤860 这一段顶栏 .nav-links 是 display:none，
   于是「自测 / 更新」在这个区间原本**没有任何入口**（实测：唯一那两个
   链接宽度为 0）。把导航搬到底部后，全区间「词条 / 自测 / 更新 / 收藏」都是一次点击。
   ≥861 顶栏放得下，tab 栏隐藏、节点搬回顶栏。
   （续 10：断点由 960 收到 860，理由见上面那段注释；861–960 顶栏现在也放得下导航。）
   v1.1.3（续 9）安全区说明：下面 4 处 env(safe-area-inset-bottom) 是「将来若给 <meta name="viewport">
   加上 viewport-fit=cover 时的保险」。本文件当前**没有** viewport-fit——iOS Safari 按默认 auto 会把
   整个布局视口（含本 position:fixed 的 tab 栏）自动收进安全区，所以这些 env() 现在解析为 0px、
   既不生效也不会被 iPhone 横条压住（现状是安全的）。要动 <meta viewport> 就回来一起复验这 4 处。
   ============================================================ */
.tabbar{display:none}
@media (max-width:860px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;gap:2px;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border-light)}
  .tabbar[hidden]{display:none}
  .tabbar .nav-links{display:flex;flex:1 1 auto;min-width:0;gap:2px}
  .tabbar .nav-links a{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;
    height:44px;padding:0 4px;border-radius:10px;white-space:nowrap;font-size:13px}
  .tabbar .nav-fav{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;
    height:44px;padding:0 4px;margin:0;gap:4px;border:0;background:transparent;font-size:13px}
  .tabbar .nav-fav:hover{background:var(--bg-hover)}
  .tabbar .nav-fav span.fav-label{display:inline}
  /* 内容与右下角浮标给 tab 栏让位 */
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .back-top{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition:none!important;animation:none!important}
}

<script>

   2) 把 KB_TERMS 换成本模块词条——除 id/name/definition 外

   3) 示意插图用 Demo Kit 积木拼装（配方见《文档/DemoKit配方册.md》）；
   4) 所有占位内容带「【示例】」前缀（英文侧对应 `[Sample]`），接入完成后应全部替换；

/* ================== 模块配置区：接入时必改 ================== */
/* ------------------------------------------------------------
   你正在看的是「引擎母版」本身（templates/词条图鉴模板-v5.html）。

var SITE_META = {
  brand: '鉴',                             // 品牌字。v5（2026-09-27）起顶栏 logo 已图形化为内联 SVG 闪电（见 <body> 里的 .nav-logo），
                                           // 本字段不再出现在顶栏，仅作 brandName 缺失时的兜底（引擎侧 brandName || brand）。

   ============================================================ */
var KB_TERMS = [

  /* ---------- 旗舰示例：全模块齐上，接手时照此删减 ---------- */
  {
    id: 'doc-online', cat: 'c1',
    name: '【示例】在线文档', nameEn: 'Online Doc',

      + '<div class="dk-move"><span>生成链接</span><i>→</i></div>'

   两类都没给就整体保留 zh —— 即「英文图可按需渐进提供，没提供就显示中文图」。
   pairName：该项是 name / nameEn 成对的（如常见变体）——EN 给了 name 就不沿用 zh 的 nameEn，
   否则会出现「3-in-1 3-in-1」这种同一个英文名显示两遍。 */
function mergeItems(zhList, enList, textKeys, imgKeys, pairName){

      var keys = (textKeys || []).concat(imgKeys || []);
      for (var t = 0; t < keys.length; t++){
        var tk = keys[t];
        if (en[tk] !== undefined && en[tk] !== null) item[tk] = en[tk];
      }

    var it = { text: (enSide[i] && enSide[i].text) ? enSide[i].text : zhSide[i].text };
    /* v5（2026-09-20）：mock 是图——EN 给了英文图就用英文图，否则保留中文图 */
    var mock = (enSide[i] && enSide[i].mock) ? enSide[i].mock : zhSide[i].mock;

  if (en.name){ out.name = en.name; out.nameEn = en.nameEn || ''; }

  if (en.demo !== undefined && en.demo !== null) out.demo = en.demo;
  if (en.demoCtl !== undefined && en.demoCtl !== null) out.demoCtl = en.demoCtl;

  if (en.variants && out.variants) out.variants = mergeItems(out.variants, en.variants, ['name', 'nameEn', 'desc'], ['mock'], true);
  if (en.scenes && out.scenes) out.scenes = mergeItems(out.scenes, en.scenes, ['cap'], ['shot']);

   这是最硬的证据。但本项目的使用者要的是「顺着一条主线读下去」，而子分类太窄：
   电驱与电机只有 c1/c2 两类时，永磁同步的左右都出不了 c2。
   保持 KB_TERMS 声明序，因此「列表里前后两条」与「左右切换」完全一致，可预测。 */
function siblingsOf(t){
  if (!t) return [];
  var key = topicOfTerm(t);
  var all = termsView();
  var list = [];
  for (var i = 0; i < all.length; i++){
    var x = all[i];
    if (topicOfTerm(x) === key) list.push(x);
  }

function siblingIndexOf(id, list){
  for (var i = 0; i < list.length; i++){ if (list[i].id === id) return i; }
  return -1;

/* 端点停住（任务 2 拍板，2026-09-19）：主线读到头就停，不再环状绕回——
   最后一条不渲染「下一条」、第一条不渲染「上一条」，键盘 ←/→ 到端点自然无效，
   避免长主题里「下一条」像跳回上一条。同主题只有 1 条时仍返回 null（不渲染浮动导航）。 */
function nextTermOf(id){
  var list = siblingsOf(termById(id));
  if (list.length < 2) return null;
  var i = siblingIndexOf(id, list);
  if (i < 0 || i >= list.length - 1) return null;
  return list[i + 1];
}
function prevTermOf(id){
  var list = siblingsOf(termById(id));
  if (list.length < 2) return null;
  var i = siblingIndexOf(id, list);
  if (i <= 0) return null;
  return list[i - 1];
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/* 转义 + 解析 [[词条id|显示文字]] 互链

function fmt(s){
  return esc(s).replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, function(m, id, txt){
    var ok = !!termById(id);
    return '<span class="c-ref"' + (ok ? ' tabindex="0" role="link"' : '') +
      ' data-term="' + id + '">' + (ok ? '<b>' + txt + '</b>' : txt) + '</span>';
  });
}

/* ---------- 搜索关键词高亮（v2：esc 后按 state.q 包 <mark>） ---------- */
function hlQ(s){
  if (!state.q) return esc(s);
  var e = esc(s);
  var q = esc(state.q);
  var rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return e.replace(rx, '<mark>$1</mark>');
}

/* v4：同一句文案连续触发时读屏常常不重播 —— 先清空、下一轮任务再写入，
   配合 aria-atomic="true" 让读屏每次都当新内容播报；1800ms 的视觉时序不变。 */
function toast(msg){
  var t = el('toast');
  clearTimeout(toast._h);
  t.classList.remove('show');
  t.textContent = '';
  setTimeout(function(){
    t.textContent = msg;
    t.classList.add('show');
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }, 0);
}

/* v4.1：侧栏二级目录 = 本主题的分类，常驻、点击滚动定位、滚动时高亮。
   v4 是「标题下的横向 chips，且仅当分类数 ≥2 才渲染」；扁平主题（无分类）整块隐藏。
   一级主题就在它上方，所以不再单独给一个「本主题」锚点——那一行是重复的。 */
function renderCatList(){
  var host = el('catList');
  var title = el('sideTitleCat');
  var sep = el('sideSep');
  var cats = currentCats();
  if (!cats.length){
    host.hidden = true; host.innerHTML = '';
    if (title) title.hidden = true;
    if (sep) sep.hidden = true;
    return;
  }
  if (title){ title.hidden = false; title.textContent = MT('sideCats'); }
  if (sep) sep.hidden = false;
  var pool = termsOfTopic(state.topic), visible = [], i, j;
  for (i = 0; i < pool.length; i++){ if (matchQ(pool[i])) visible.push(pool[i]); }
  var html = '';
  for (i = 0; i < cats.length; i++){
    var n = 0;
    for (j = 0; j < visible.length; j++){ if (visible[j].cat === cats[i].id) n++; }
    html += '<button type="button" class="side-cat" data-catgoto="cat-' + esc(cats[i].id) + '">' +
      '<span>' + esc((state.lang === 'en' && cats[i].nameEn) ? cats[i].nameEn : cats[i].name) + '</span><span class="cnt">' + n + '</span></button>';
  }
  host.innerHTML = html;
  host.hidden = false;
}

/* v4.1：量出正文列（.detail-body）的左右边缘，写进 CSS 变量给固定浮标当锚点。

   我们的正文列在侧栏右边、宽度随视口变，所以只能量。只在切视图与改窗口时算，不逐帧测。 */
function syncFloatAnchor(){

  var col = el('termView').querySelector('.detail-body');
  if (!col){ s.removeProperty('--fl-right'); s.removeProperty('--fr-left'); return; }

  var vw = document.documentElement.clientWidth || window.innerWidth;
  s.setProperty('--fl-right', Math.round(vw - r.left + 14) + 'px');

}
