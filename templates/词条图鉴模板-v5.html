/* 轻量容错：q 与 hay 某子串的编辑距离 ≤1（替换 / 多打一位 / 漏打一位）。
   窗口长度取 |q|±1 各扫一遍；editLe1 是双指针线性比较（距离 ≤1 时无需全矩阵）。 */
function editLe1(a, b){
  if (a === b) return true;
  var la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  var i = 0, j = 0, used = false;
  while (i < la && j < lb){
    if (a.charAt(i) === b.charAt(j)){ i++; j++; continue; }
    if (used) return false;
    used = true;
    if (la > lb) i++;
    else if (la < lb) j++;
    else { i++; j++; }
  }
  return used ? (la - i) + (lb - j) === 0 : (la - i) + (lb - j) <= 1;
}
function fuzzyContains(hay, q){
  if (hay.indexOf(q) >= 0) return true;
  if (q.length < 3) return false;
  for (var k = q.length - 1; k <= q.length + 1; k++){
    for (var i = 0; i + k <= hay.length; i++){
      if (editLe1(hay.substr(i, k), q)) return true;
    }
  }
  return false;
}

    for (var i = 0; i < KB_TERMS.length; i++) kbZhIdx[KB_TERMS[i].id] = KB_TERMS[i];
  }
  return kbZhIdx[id] || null;
}
/* v5（2026-09-28 工程线体检 D1 修复）：命中语料构建抽出（字段清单与语言无关）——
   两套语料必须同构再合并；首版只并了「名称/英文名/别名」，被回归断言实测抓出漏角（正文里的命中缺失） */
function searchPartsOf(x){
  var parts = [x.name, x.nameEn, x.scenario, x.definition, x.defNote, (x.aliases || []).join(' ')];
  if (x.sections){
    for (var i = 0; i < x.sections.length; i++) parts.push(x.sections[i].h);
  }
  if (x.confusions){
    for (var j = 0; j < x.confusions.length; j++) parts.push(x.confusions[j].name);
  }
  return parts;
}
function matchQ(t){
  if (!state.q) return true;
  var q = state.q.toLowerCase();
  /* v3 修复：命中范围追加正文分点小节名与混淆项名；v5（2026-09-26）再追加详解正文 */
  var parts = searchPartsOf(t);
  /* v5（2026-09-28 工程线体检 D1 修复）：英文模式下把中文原文语料整体按同序并入命中语料
     （否则已翻译词条的中文关键词整片搜不到；同序保证拼音/容错的命中面只增不减） */
  var zh = state.lang === 'en' ? kbZhById(t.id) : null;
  if (zh) parts = parts.concat(searchPartsOf(zh));
  var hay = parts.join(' ').toLowerCase();
  if (hay.indexOf(q) >= 0) return true;
  /* v5（2026-09-27）：B5 拼音首字母——纯字母/数字输入（≥2 位）时，词条名 + 英文名 + 别名的
     首字母串含 q 即命中（如 ycdj → 永磁电机；pmsm 直接命中英文名首字母）
     v5（2026-09-28 体检 D1）：英文模式再并入中文原文的首字母串（否则拼音对已翻译词条整片失效） */
  var az = q.replace(/[^a-z0-9]/g, '');
  var py = '';
  if (az.length >= 2){
    py = pyiOf(t.name + ' ' + (t.nameEn || '') + ' ' + (t.aliases || []).join(' '));
    if (zh) py += pyiOf(zh.name + ' ' + (zh.nameEn || '') + ' ' + (zh.aliases || []).join(' '));
    if (py.indexOf(az) >= 0) return true;
  }
  /* v5（2026-09-27）：B5 轻量容错——q ≥3 字符时允许 ≤1 处差错，字面与拼音各兜底一次 */
  if (q.length >= 3 && fuzzyContains(hay, q)) return true;
  if (py && az.length >= 3 && fuzzyContains(py, az)) return true;
  return false;
}

function cardHtml(t, idx){
  var delay = Math.min((idx || 0) * 35, 420);
  /* v3：可操作演示的卡片画布永远是 init 状态的静态快照（画布本身 pointer-events:none） */
  var demoHtml = t.demo ? (t.demoCtl ? demoSnapshot(t.demo, t.demoCtl.init || 0) : t.demo) : '';
  /* v4：article 不再自称 button（消除 role=button 内嵌收藏按钮的 a11y 问题），
     标题改真链接（原生支持 Enter / 右键新标签 / 读屏「链接」语义）；
     整卡点击交给事件委托的 data-card 分支 —— 修复 v3 的 B8「只有标题可点」 */
  return '<article class="card" data-card="' + esc(t.id) + '" style="animation-delay:' + delay + 'ms">' +
    '<div class="card-head">' +
      '<h3 class="card-title"><a class="card-link" data-term="' + esc(t.id) + '"' +
        ' href="#term=' + esc(t.id) + '">' + hlQ(t.name) +
        (t.nameEn ? '<span>' + hlQ(t.nameEn) + '</span>' : '') + '</a></h3>' +
      favBtn(t.id) +
    '</div>' +
    (t.scenario ? '<div class="card-quote">' + hlQ(t.scenario) + '</div>' : '') +
    '<div class="card-demo" aria-hidden="true">' +
      (demoHtml ? '<div class="dk-canvas">' + demoHtml + '</div>' : '') +
    '</div>' +
  '</article>';
}

/* v4.1：可选英文副题（CATEGORIES[].nameEn）+ data-catsec（供侧栏 scrollspy 定位） */
function sectionHtml(title, list, anchorId, titleEn, catKey){
  if (!list.length) return '';

  for (var i = 0; i < list.length; i++) cards += cardHtml(list[i], i);
  return '<section class="cat-section"' + (anchorId ? ' id="' + anchorId + '"' : '') +
    (catKey ? ' data-catsec="' + esc(catKey) + '"' : '') +
    '><h2>' + esc(title) + (titleEn ? '<em class="sec-en">' + esc(titleEn) + '</em>' : '') +
    '<span class="cnt">' + ts('termsUnit', list.length + ' 个词条', { n: list.length }) + '</span></h2>' +
    '<div class="card-grid">' + cards + '</div></section>';
}

function renderTopicView(){
  var view = el('topicView');
  var html = '';
  var shown = 0;
  /* v3 修复 B7 + v4：回到列表视图时恢复标签页标题（搜索结果走 searchTitle 模板） */
  document.title = state.q
    ? metaTitleOf('searchTitle')
    : sm('pageTitle');

  if (state.q){
    /* v2：全局搜索——跨全部主题聚合，按主题分组展示（v5：搜索词条走 termsView，英文模式搜英文） */
    var results = [];
    var allTerms = termsView();
    for (var i = 0; i < allTerms.length; i++){
      if (matchQ(allTerms[i])) results.push(allTerms[i]);
    }
    shown = results.length;
    html += '<div class="search-meta"><h1>' + ts('searchH1', '搜索「' + esc(state.q) + '」', { q: esc(state.q) }) + '</h1>' +
      '<span class="cnt">' + ts('resultsUnit', shown + ' 条结果', { n: shown }) + '</span><span class="scope">' + ts('acrossTopics', '跨全部主题') + '</span></div>' +
      /* v4：结果条数用读屏区播报（视觉计数已在上方，避免重复朗读） */
      '<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">' + ts('foundUnit', '找到 ' + shown + ' 条结果', { n: shown }) + '</div>';
    if (!shown){
      html += '<div class="empty-tip">' + ts('noMatch', '没有匹配「' + esc(state.q) + '」的词条，换个关键词试试。', { q: esc(state.q) }) + '</div>';
    } else {
      for (var ti = 0; ti < TOPICS.length; ti++){
        var inTp = [];
        for (var r = 0; r < results.length; r++){
          if (topicOfTerm(results[r]) === TOPICS[ti].id) inTp.push(results[r]);
        }
        /* v5：分组标题按界面语言取（zh = 中文 + 英文副题；en = 英文主标题、不再显示副题） */
        if (inTp.length) html += sectionHtml(topicName(TOPICS[ti]), inTp, null, state.lang === 'en' ? '' : (TOPICS[ti].nameEn || ''));
      }
      var orphan = [];
      for (var o = 0; o < results.length; o++){
        if (!topicById(topicOfTerm(results[o]))) orphan.push(results[o]);
      }
      if (orphan.length) html += sectionHtml(ts('ungrouped', '未分组'), orphan);
    }
  } else if (state.favOnly){
    var favList = [];
    var favPool = termsView();
    for (var fi = 0; fi < favPool.length; fi++){
      if (isFav(favPool[fi].id) && matchQ(favPool[fi])) favList.push(favPool[fi]);
    }
    shown = favList.length;
    html += '<div class="topic-heading"><h1>' + esc(MT('favList')) + '</h1><span class="cnt">' + ts('itemsUnit', shown + ' 个', { n: shown }) + '</span></div>';
    html += sectionHtml(ts('favoritedSec', '已收藏'), favList);
    if (!shown) html += '<div class="empty-tip">' + ts('favEmpty', '还没有收藏——点词条卡片右上角的星标收藏。') + '</div>';
  } else {
    var topic = topicById(state.topic) || TOPICS[0];
    var all = termsOfTopic(topic.id);
    var visible = [];
    for (var j = 0; j < all.length; j++){ if (matchQ(all[j])) visible.push(all[j]); }
    shown = visible.length;
    /* v5（2026-09-27 体验批次·件 6A）：Apple Large Title 双元素——大标题随流滚走，
       .lt-small（#topicView 直接子元素，sticky 钉顶）按滚动进度淡入接位（syncLtFade） */
    /* v1.1.3 修复：大标题副题只承担「另一种语言的标题」，不再回退成词条数——
       回退成词条数会让「3 个词条」在标题右侧与副题各出现一次（英文界面 100% 复现；
       中文界面在主题没写 nameEn 时也复现）。没有副题就不渲染 <small>，计数交给右侧 .cnt。 */
    var ltSub = (state.lang !== 'en' && topic.nameEn) ? topic.nameEn : '';
    html += '<div class="topic-heading"><div class="lt-big-h"><h1>' + esc(topicHeading(topic)) + '</h1>' +
      (ltSub ? '<small>' + esc(ltSub) + '</small>' : '') + '</div>' +
      '<span class="cnt">' + ts('termsUnit', shown + ' 个词条', { n: shown }) + '</span></div>' +
      '<div class="lt-small" aria-hidden="true"><h1>' + esc(topicHeading(topic)) + '</h1></div>';

    /* 主题有分类 → 按分类分节；无分类 → 单节直挂 */
    var cats = [];
    for (var k = 0; k < CATEGORIES.length; k++){
      if (CATEGORIES[k].topic === topic.id) cats.push(CATEGORIES[k]);
    }
    if (cats.length){
      /* v4.1：横向锚点 chips 已移除——分类目录改为常驻左栏（见 renderCatList）。
         分节仍带 id 供滚动跳转，另加 data-catsec 供 scrollspy 反查。 */
      for (var c = 0; c < cats.length; c++){
        var inCat = [];
        for (var v = 0; v < visible.length; v++){
          if (visible[v].cat === cats[c].id) inCat.push(visible[v]);
        }
        /* v5：分类标题按界面语言取（zh = 中文 + 英文副题；en = 英文主标题） */
        var catName = (state.lang === 'en' && cats[c].nameEn) ? cats[c].nameEn : cats[c].name;
        var catSub = (state.lang === 'en') ? '' : (cats[c].nameEn || '');
        html += sectionHtml(catName, inCat, 'cat-' + cats[c].id, catSub, cats[c].id);
      }
      var orphans = [];
      for (var o = 0; o < visible.length; o++){
        if (!visible[o].cat) orphans.push(visible[o]);
      }
      if (orphans.length) html += sectionHtml(ts('others', '其他'), orphans);
    } else {
      html += sectionHtml(ts('allTermsSec', '全部词条'), visible);
    }
  }

  view.innerHTML = html;
  view.hidden = false;
  el('termView').hidden = true;
  syncCatActive();          /* v4.1：列表重渲后重新对一次侧栏高亮 */
  syncLtFade();             /* v5（2026-09-27 件 6A）：Large Title 初始透明度对齐（如深链带滚动位置） */
}

/* ---------- v5（2026-09-26 工程线任务书①）：更新日志视图 ----------
   数据源 var CHANGELOG（content/更新日志.md 经 engineering/拼合.mjs 注入；缺省或空则显示空态）。
   条目按日期倒序（数据责任，#debug 查倒序与字段）；terms 引用的词条 id 必须存在（#debug 防悬空）。
   明细文字支持 [[id|互链]]（与词条正文同一 fmt 机制）；骨架走 ts()。
   v5（2026-09-29 更新日志英文版）：en 模式取 var CHANGELOG_EN（content/更新日志-en.md 注入），
   与中文按「日期 + 同日序号」逐条对齐、缺条回退中文；月份标签走 clMonthLabel()（en=September 2026）。 */
/* v5（2026-09-29）：更新日志的语言感知取数——en 模式在中文表上覆盖英文条目（按「日期 + 同日序号」匹配；
   英文缺条或字段缺失逐项回退中文）；zh 模式直返 CHANGELOG。渲染层不感知语言。 */
function changelogView(){
  var zh = (typeof CHANGELOG !== 'undefined' && CHANGELOG instanceof Array) ? CHANGELOG : [];
  var en = (typeof CHANGELOG_EN !== 'undefined' && CHANGELOG_EN instanceof Array) ? CHANGELOG_EN : null;
  if (state.lang !== 'en' || !en || !en.length) return zh;
  var map = {}, cnt = {};
  for (var i = 0; i < en.length; i++){
    var e = en[i] || {}, d = String(e.date || '');
    cnt[d] = (cnt[d] || 0) + 1;
    map[d + '#' + cnt[d]] = e;
  }
  var out = [], zc = {};
  for (var j = 0; j < zh.length; j++){
    var z = zh[j] || {}, zd = String(z.date || '');
    zc[zd] = (zc[zd] || 0) + 1;
    var m = map[zd + '#' + zc[zd]];
    if (!m){ out.push(z); continue; }
    out.push({
      date: z.date,
      version: m.version || z.version,
      title: m.title || z.title,
      items: (m.items && m.items.length) ? m.items : z.items,
      terms: (m.terms && m.terms.length) ? m.terms : z.terms,
      kind: m.kind || z.kind
    });
  }
  return out;
}
/* v5（2026-09-29）：月份标签——zh「2026 年 9 月」/ en「September 2026」（仅 changelog 侧栏使用） */
var CL_MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function clMonthLabel(mk){
  var y = mk.split('-')[0], m = parseInt(mk.split('-')[1], 10);
  if (state.lang === 'en') return (CL_MONTHS_EN[m - 1] || m) + ' ' + y;
  return y + ' 年 ' + m + ' 月';
}
function renderChangelogView(){
  var list = changelogView();

  /* 分类：契约可选 kind（'update'|'terms'），缺省按 terms 有无推断——对齐参考站筛选三类 */
  function kindOf(c){ return (c.kind === 'update' || c.kind === 'terms') ? c.kind : ((c.terms && c.terms.length) ? 'terms' : 'update'); }
  /* 统计口径（对齐参考站统计区，恒按全量、不随筛选变）：迭代数 = 条目数；收录词汇 = terms 去重；功能改进 = items 汇总 */
  var termSet = {}, imprTotal = 0, monthSeen = {}, months = [];
  for (var i0 = 0; i0 < list.length; i0++){
    var c0 = list[i0] || {};
    if (c0.items) imprTotal += c0.items.length;
    if (c0.terms){ for (var k0 = 0; k0 < c0.terms.length; k0++) termSet[c0.terms[k0]] = 1; }
    var m0 = String(c0.date || '').slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(m0) && !monthSeen[m0]){ monthSeen[m0] = 1; months.push(m0); }

  /* 筛选（对齐参考站 filter-group：全部 / 功能更新 / 新增词汇） */
  if (state.clFilter !== 'update' && state.clFilter !== 'terms') state.clFilter = 'all';
  var shown = [];
  for (var i1 = 0; i1 < list.length; i1++){
    if (state.clFilter === 'all' || kindOf(list[i1] || {}) === state.clFilter) shown.push(list[i1]);

  /* 侧栏：时间定位（按月份快速定位，条数恒按全量；数据跨月后自动长出多组）+ 统计三数 */

  sideHtml += '<div class="cl-stats">' +

  /* 筛选条（is-active 高亮 + 滑动指示器 syncClFilterInd 定位） */

  var filterHtml = '<div class="cl-filter" role="tablist" aria-label="' + ts('clFilterLabel', '筛选更新') + '"><span class="cl-filter-ind" aria-hidden="true"></span>';

      filters[fi][1] + '</button>';

    '<div class="cl-main">' +
      '<nav class="cl-crumb" aria-label="Breadcrumb"><a href="' + esc(listHashOf()) + '">' + esc(SITE_META.brandName || '') + '</a>' +

/* ---------- 件 2 · 闪卡自测（队列制：没会的卡排队尾，直到全会收卷；不记录进度） ---------- */
var fQueue = [], fState = {}, fPool = [], fCur = -1, fFlip = false, fTopicId = '';
function practiceTopics(){

  for (var i = 0; i < TOPICS.length; i++){

  }

}
function renderPracticeView(){

      '<span class="cur">' + ts('practiceTitle', '自测') + '</span></nav>' +
    '<div class="topic-heading"><h1>' + ts('practiceTitle', '自测') + '</h1>' +
      '<span class="cnt">' + esc(topicName(curTp)) + ' · ' + ts('termsUnit', cnt + ' 个词条', { n: cnt }) + '</span></div>' +
    '<div class="practice-head"><div class="dd" data-dd="practiceTopic">' +
      '<button type="button" class="dd-btn" data-ddtoggle="1" aria-haspopup="listbox" aria-expanded="false">' +
        '<span class="t">' + esc(topicName(curTp)) + '</span><i class="dd-caret" aria-hidden="true"></i></button>' +
      '<div class="dd-list" role="listbox" aria-label="' + ts('practicePick', '选择主题') + '">' + items + '</div>' +
    '</div><span class="practice-tip">' +
      ts('practiceTip', '正面是术语名，先在脑子里回忆，翻面对答案；没会的卡会排到队尾再来一遍，直到全部会了。') +
    '</span></div>' +
    '<div class="flash-stage">' +
      '<div class="flash-card" id="fCard" tabindex="0" role="button" aria-label="' + ts('flashFlipAria', '闪卡：点击或按空格翻面') + '">' +
        '<div class="flash-face" id="fFaceFront"><div class="hint">' + ts('flashHint', '点击卡片翻面 · 先在脑子里回忆') + '</div>' +
          '<div class="term" id="fTerm"></div><div class="en" id="fEn"></div></div>' +   /* v1.1.3：正面去掉「来源卡：xxx」——它与正面大标题是同一个词条名，白占一行 */
        /* v1.1.3（续 9）：背面翻面前挂 aria-hidden="true"。翻面只是 CSS 的 rotateY + backface-visibility
           （纯视觉），答案节点仍留在无障碍树里——实测翻面前读屏就能读到「一句话答案 + 正文原文」，
           自测对读屏用户等于失效。开合由 syncFlipAria() 随 .flip 同步切换。 */
        '<div class="flash-face back" id="fFaceBack" aria-hidden="true"><div class="hint">' + ts('flashBackHint', '一句话答案') + '</div>' +
          '<div class="line" id="fLine"></div><div class="src" id="fSrc2"></div></div>' +

function practiceSetTopic(tid){
  if (!topicById(tid) || topicCount(tid) < 1) return;
  fTopicId = tid;
  renderPracticeView();     /* 整壳重渲：下拉高亮、标题计数与卡堆一并刷新 */
}
function practiceStart(tid){
  fPool = termsOfTopic(tid);
  fQueue = [];
  fState = {};
  for (var i = 0; i < fPool.length; i++) fQueue.push(i);
  fFlip = false;
  practiceRenderQ();
}
function practiceRenderQ(){
  fCur = fQueue[0];
  var c = fPool[fCur];
  el('fTerm').textContent = c.name;
  el('fEn').textContent = c.nameEn || '';
  /* 背面 = scenario（任务书定稿）；个别导言卡缺 scenario 时回落 definition，避免空背面 */
  el('fLine').textContent = c.scenario || c.definition || '';
  var src = (c.__seq ? c.__seq + ' ' : '') + c.name;
  var srcTxt = ts('flashSrc', '来源卡：' + src, { n: src });
  el('fSrc2').textContent = srcTxt;   /* v1.1.3：正面那份已删（与正面大标题重复），背面保留 */
  el('fCard').classList.remove('flip');
  fFlip = false;
  syncFlipAria();   /* v1.1.3（续 9）：换卡时把无障碍开合同步回「只暴露正面」 */
  el('fYes').disabled = true;
  el('fNo').disabled = true;
  /* 进度点：绿=会、红=没会（还在队尾等二刷）、蓝=当前（样张同款优先级） */
  var d = '';
  for (var i = 0; i < fPool.length; i++){
    var st = fState[i];
    d += '<i class="' + (st === true ? 'ok' : st === false ? 'ng' : (i === fCur ? 'cur' : '')) + '"></i>';
  }
  el('fDots').innerHTML = d;
  /* v1.1.3：进度数字（与圆点同一份状态，给"还要几张"一个可读的答案）
     v1.1.3（续 9）修复：fState 是对象字面量（fState = {}，见 practiceStart），没有 .length——
     原写法 fState.length 恒为 undefined，循环一次都不跑，okN 永远是 0，进度数字恒显示「已会 0 / N」。
     改用与上面圆点循环、以及完成分支同一口径的 fPool.length。 */
  var okN = 0;
  for (var q = 0; q < fPool.length; q++){ if (fState[q] === true) okN++; }
  var fc = el('fCount');
  if (fc) fc.textContent = ts('practiceProgress', '已会 ' + okN + ' / ' + fPool.length, { ok: okN, n: fPool.length });
}
/* v1.1.3（续 9）：把「翻面」的视觉状态同步到无障碍树。
   翻面本身只是 .flip 类 + CSS 3D 变换，读屏读不到翻没翻——不挂 aria-hidden 的话，
   翻面前答案正文就已经在无障碍树里（实测 9 个非 ignored 节点）。 */
function syncFlipAria(){
  var front = el('fFaceFront'), back = el('fFaceBack');
  if (front) front.setAttribute('aria-hidden', fFlip ? 'true' : 'false');
  if (back) back.setAttribute('aria-hidden', fFlip ? 'false' : 'true');
}
function practiceFlip(){
  fFlip = !fFlip;
  el('fCard').classList.toggle('flip', fFlip);
  syncFlipAria();
  if (fFlip){ el('fYes').disabled = false; el('fNo').disabled = false; }
}
function practiceJudge(ok){
  fState[fCur] = ok;
  if (!ok) fQueue.push(fQueue.shift());   /* 没会 → 排到队尾再出现一遍 */
  else fQueue.shift();
  if (!fQueue.length){
    var okN = 0, i;
    for (i = 0; i < fPool.length; i++){ if (fState[i] === true) okN++; }
    /* ts() 的 vars 只在英文分支替换；中文由调用侧拼好（MEMORY §31-5） */
    el('fDots').innerHTML = '<div class="flash-done"><b>' +
      ts('practiceDone', '全部会了：' + okN + ' / ' + fPool.length + '（没会的卡都会再来一遍）', { n: okN, m: fPool.length }) +
      '</b><br><button type="button" class="judge yes" id="fAgain">' + ts('practiceAgain', '再来一轮') + '</button></div>';
    el('fAgain').addEventListener('click', function(){ practiceStart(fTopicId); });
    /* v1.1.3（续 9）：完成分支不重绘卡面，得把进度数字一并收口——
       否则最后一张答完时下面还停在上一次的值（如「已会 2 / 3」），与上面「全部会了：3 / 3」自相矛盾 */
    var fcDone = el('fCount');
    if (fcDone) fcDone.textContent = ts('practiceProgress', '已会 ' + okN + ' / ' + fPool.length, { ok: okN, n: fPool.length });
    return;
  }
  practiceRenderQ();
}

/* 详解要点 = defNote 按「·」还原条目（数据层 items.map(s=>'·'+s).join('')，见 lib-md parseField）。
   渲染走 fmt() 管线（[[互链]] 与转义同 sectionsHtml），不自己剥标记 */
function defNoteItems(t){

/* ---------- 件 6A · Large Title 交叉淡入驱动（挂进 scroll rAF；只动 opacity） ---------- */
function syncLtFade(){
  var sm = document.querySelector('.lt-small');
  if (!sm) return;
  var big = document.querySelector('.lt-big-h');
  if (!big){ sm.style.opacity = '0'; return; }
  var top = big.getBoundingClientRect().top;
  /* 大标题顶部滚过顶栏底后，小标题按 16px 行程淡入接位。
     v5（2026-09-27 返工）：直接驱动、不挂过渡（retarget 发黏问题见 CSS 注释），快滚一帧到位。
     v5（2026-10-01 顶栏重排）：阈值改为实时量顶栏高度——手机两行顶栏是 110px，
     再写死 60 会让小标题在大标题还差 50px 时就淡入（错位）。 */
  var navEl = document.querySelector('header.nav');
  var navH = navEl ? navEl.offsetHeight : 60;
  var o = Math.min(1, Math.max(0, (navH - top) / 16));
  sm.style.opacity = String(o);
}

/* ---------- 可操作演示引擎（v3：demoCtl 状态机） ----------
   「离散状态 + 可见性规则」一个机制覆盖两类原站交互：
   步进（再放一项/移除/重置）= step 按钮；直达（三态切换）= to 按钮。
   作者只在 demo HTML 上写 data-at / data-at-min / data-at-max，不为词条写专属 CSS */
function applyDemoState(root, st){
  var nodes = root.querySelectorAll('[data-at],[data-at-min],[data-at-max]');
  for (var i = 0; i < nodes.length; i++){
    var n = nodes[i];
    var show = true;
    var at = n.getAttribute('data-at');
    var mn = n.getAttribute('data-at-min');
    var mx = n.getAttribute('data-at-max');
    if (at !== null) show = show && parseInt(at, 10) === st;
    if (mn !== null) show = show && st >= parseInt(mn, 10);
    if (mx !== null) show = show && st <= parseInt(mx, 10);
    n.style.display = show ? (n.getAttribute('data-disp') || '') : 'none';
  }
}
/* 卡片画布用的静态快照：在脱离文档的容器里应用一次状态再取回 HTML */
function demoSnapshot(html, st){
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  applyDemoState(tmp, st);
  return tmp.innerHTML;
}
function demoActsHtml(ctl){
  var h = '<div class="dk-acts">';
  for (var i = 0; i < ctl.acts.length; i++){
    var a = ctl.acts[i];
    if (a.step !== undefined){
      h += '<button type="button" class="dk-act" data-demo-step="' + a.step + '">' + esc(a.label) + '</button>';
    } else {
      h += '<button type="button" class="dk-act" data-demo-to="' + a.to + '">' + esc(a.label) + '</button>';
    }
  }
  return h + '</div>';
}
/* 把 .dk-live 根同步到指定状态：显隐、按钮边界禁用、to 按钮高亮 */
function demoSet(live, ctl, st){
  st = Math.max(0, Math.min(ctl.states - 1, st));
  live.setAttribute('data-st', st);
  live.className = 'dk-live st-' + st;
  applyDemoState(live, st);
  var btns = live.querySelectorAll('.dk-act');
  for (var i = 0; i < btns.length; i++){
    var b = btns[i];
    if (b.getAttribute('data-demo-step') !== null){
      var target = st + parseInt(b.getAttribute('data-demo-step'), 10);
      b.disabled = target < 0 || target > ctl.states - 1;
      b.classList.remove('on');
    } else {
      b.disabled = false;
      b.classList.toggle('on', parseInt(b.getAttribute('data-demo-to'), 10) === st);
    }
  }
}

   原站行为：点部件高亮并进入「锁定」态，Esc 解除锁定且不离开页面 */
function setAnatomy(wrap, idx){
  if (!wrap) return;
  if (idx == null) wrap.removeAttribute('data-anat');
  else wrap.setAttribute('data-anat', String(idx));
  var on = idx != null;
  var marks = wrap.querySelectorAll('.anat-stage [data-ap]');
  for (var i = 0; i < marks.length; i++){
    marks[i].classList.toggle('is-anat-active', on && marks[i].getAttribute('data-ap') === String(idx));
  }
  var parts = wrap.querySelectorAll('.anat-part');
  for (var j = 0; j < parts.length; j++){
    var isOn = on && parts[j].getAttribute('data-apart') === String(idx);
    parts[j].classList.toggle('is-anat-active', isOn);
    var btn = parts[j].querySelector('[data-apart-btn]');
    if (btn) btn.setAttribute('aria-expanded', isOn ? 'true' : 'false');
  }
}

function flowGo(idx){
  var wrap = document.querySelector('.flow-wrap');
  if (!wrap) return;
  var t = termById(wrap.getAttribute('data-flow'));
  if (!t || !t.flow || !t.flow.steps.length) return;
  var steps = t.flow.steps;
  idx = Math.max(0, Math.min(steps.length - 1, idx));

  var s = steps[idx];
  var tag = wrap.querySelector('.flow-tag');
  tag.innerHTML = '<b>' + esc(s.tag) + '</b>' + (s.sub ? '<span>' + esc(s.sub) + '</span>' : '');
  var body = wrap.querySelector('.fs-body');
  body.innerHTML = s.mock || '';
  /* 重建节点以重触发 flowFade 入场动画 */
  var nb = body.cloneNode(false);
  nb.innerHTML = body.innerHTML;
  body.parentNode.replaceChild(nb, body);
  var dots = '';
  for (var i = 0; i < steps.length; i++){
    var isCur = i === idx;
    var isTerm = t.flow.current === i + 1;
    dots += '<button type="button" class="flow-sdot' + (isCur ? ' cur' : '') + (isTerm ? ' is-cur-term' : '') +
      '" data-flow-go="' + i + '" role="tab" aria-selected="' + (isCur ? 'true' : 'false') + '"' +

  }
  wrap.querySelector('.flow-dots').innerHTML = dots;
  wrap.querySelector('.flow-pos').textContent = (idx + 1) + ' / ' + steps.length;
  wrap.querySelector('[data-flow-prev]').disabled = idx === 0;
  wrap.querySelector('[data-flow-next]').disabled = idx === steps.length - 1;

/* v4：Markdown 导出的章节标题与页面共用 MODULE_TITLES / FIELD_LABELS，
   且**章节顺序与页面渲染顺序逐条一致**（flow → 正文分点 → 混淆 → 选择题 →
   告诉 AI → 用法 → 组成结构 → 变体 → 场景 → 接下来 → 延伸阅读）。
   正文里的 [[id|文字]] 互链语法原样保留，便于再导入；demoNote 此前漏导出，v4 补上。 */
function markdownOf(t){
  var md = '# ' + t.name + (t.nameEn ? ' ' + t.nameEn : '') + '\n\n';
  if (t.scenario) md += '> ' + FIELD_LABELS.scenario + '：' + t.scenario + '\n\n';
  if (t.definition) md += '**' + t.definition + '**\n\n';
  if (t.defNote) md += t.defNote + '\n\n';
  if (t.demoAnswer) md += FIELD_LABELS.oneLine + '：' + t.demoAnswer + '\n\n';
  if (t.demoNote) md += t.demoNote + '\n\n';
  if (t.prereqs && t.prereqs.length) md += FIELD_LABELS.prereq + '：' + t.prereqs.map(function(p){ return p.name; }).join('、') + '\n\n';
  if (t.aliases && t.aliases.length) md += FIELD_LABELS.alias + '：' + t.aliases.join('、') + '\n\n';
  if (t.flow && t.flow.steps && t.flow.steps.length){
    var cur = t.flow.current || 1;
    md += '## ' + (t.flow.title || MODULE_TITLES.flow) + '\n\n' +
      t.flow.steps.map(function(s, i){
        return (i + 1) + '. ' + s.tag + (s.sub ? '——' + s.sub : '') + (i + 1 === cur ? ' ← 当前术语负责' : '');
      }).join('\n') + '\n\n';
  }
  if (t.sections && t.sections.length){
    md += '## ' + MODULE_TITLES.sections + '\n\n';
    for (var i = 0; i < t.sections.length; i++){
      md += '### ' + t.sections[i].h + '\n\n' + t.sections[i].paras.join('\n\n') + '\n\n';
    }
  }
  if (t.confusions && t.confusions.length){
    md += '## ' + MODULE_TITLES.confusions + '\n\n' + t.confusions.map(function(c){
      return '- vs ' + c.name + '：' + c.say;
    }).join('\n') + '\n\n';
  }
  if (t.quiz && t.quiz.options && t.quiz.options.length){
    md += '## ' + MODULE_TITLES.quiz + '\n\n' + t.quiz.q + '\n\n';
    for (var q = 0; q < t.quiz.options.length; q++){
      md += String.fromCharCode(65 + q) + '. ' + t.quiz.options[q] + '\n';
    }
    md += '\n答案：' + String.fromCharCode(65 + t.quiz.answer) +
      (t.quiz.explain ? '（' + t.quiz.explain + '）' : '') + '\n\n';
  }
  if (t.aiPrompt) md += '## ' + MODULE_TITLES.aiPrompt + '\n\n' + t.aiPrompt + '\n\n';
  if (t.usage && (t.usage.do || t.usage.dont)){
    md += '## ' + MODULE_TITLES.usage + '\n\n';
    if (t.usage.do && t.usage.do.length){
      md += '### ' + MODULE_TITLES.usageDo + '\n\n' +
        t.usage.do.map(function(x){ return '- ✓ ' + x.text; }).join('\n') + '\n\n';
    }
    if (t.usage.dont && t.usage.dont.length){
      md += '### ' + MODULE_TITLES.usageDont + '\n\n' +
        t.usage.dont.map(function(x){ return '- ✕ ' + x.text; }).join('\n') + '\n\n';
    }
  }
  if (t.anatomy && t.anatomy.parts && t.anatomy.parts.length){
    md += '## ' + MODULE_TITLES.anatomy + '\n\n' + t.anatomy.parts.map(function(p){
      return (p.idx ? p.idx + '. ' : '') + p.pn + (p.pe ? '（' + p.pe + '）' : '') + (p.pd ? '：' + p.pd : '');
    }).join('\n') + '\n\n';
  }
  if (t.variants && t.variants.length){
    md += '## ' + MODULE_TITLES.variants + '\n\n' + t.variants.map(function(v){
      return '- ' + v.name + (v.nameEn ? '（' + v.nameEn + '）' : '') + (v.desc ? '：' + v.desc : '');
    }).join('\n') + '\n\n';
  }
  if (t.scenes && t.scenes.length){
    md += '## ' + MODULE_TITLES.scenes + '\n\n' + t.scenes.map(function(s){
      return '- ' + s.cap;
    }).join('\n') + '\n\n';
  }
  if (t.next && t.next.length){
    var names = [];
    for (var n = 0; n < t.next.length; n++){
      var nt = termById(typeof t.next[n] === 'string' ? t.next[n] : t.next[n].id);
      if (nt) names.push(nt.name);
    }
    if (names.length) md += '## ' + MODULE_TITLES.next + '\n\n' + names.join('、') + '\n\n';
  }
  if (t.refs && t.refs.length){
    md += '## ' + MODULE_TITLES.refs + '\n\n' + t.refs.map(function(r){
      return '- ' + r.name + (r.url ? '：' + r.url : '');
    }).join('\n') + '\n';
  }
  return md;
}

function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(okMsg); }
    catch (e){ toast(ts('copyFail', '复制失败，请手动选择文本')); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  } else { fallback(); }
}

/* v3：无效词条 404 态（仿原站「这一页走丢了」语气）
   v4：补推荐出口——先按搜索词模糊推荐，否则给当前主题前几条，再给主题切换 */
function recoTermsOf(){
  var out = [], seen = {}, i;
  function push(t){
    if (t && !seen[t.id]){ seen[t.id] = 1; out.push(t); }
  }
  if (state.q){
    var pool = termsView();
    for (i = 0; i < pool.length && out.length < 6; i++){ if (matchQ(pool[i])) push(pool[i]); }
  }
  var tp = topicById(state.topic) ? state.topic : DEFAULT_TOPIC;
  var list = termsOfTopic(tp);
  for (i = 0; i < list.length && out.length < 6; i++) push(list[i]);
  var fallback = termsView();
  for (i = 0; i < fallback.length && out.length < 6; i++) push(fallback[i]);   /* 兜底 */
  return out;
}
function renderNotFound(){
  var h = '<div class="detail-topbar">' +
    '<button type="button" class="back-btn" data-back="1">' + ts('back', '← 返回') + '</button>' +
    '<span class="crumb">' + ts('notFoundCrumb', '未找到词条') + '</span></div>';

  var recs = recoTermsOf();
  var chips = '';
  for (var i = 0; i < recs.length; i++){
    chips += '<button type="button" class="nf-chip" data-term="' + esc(recs[i].id) + '">' +
      esc(recs[i].name) + '</button>';
  }
  var topicChips = '';
  for (var j = 0; j < TOPICS.length; j++){
    topicChips += '<button type="button" class="nf-chip" data-topic="' + esc(TOPICS[j].id) + '">' +
      esc(topicName(TOPICS[j])) + '</button>';
  }
  var recoLabel = state.q
    ? ts('recoNoQ', '没有找到「' + esc(state.q) + '」，先看看这几条', { q: esc(state.q) })
    : MT('tips');

/* ---------- v5：词条页内小节目录（正文顶部一行 chips，点击滚动到位） ----------
   条目在详情渲染完成后从 DOM 收集，与真实渲染结果一一对应——
   不重复判断各模块的渲染条件（那会随模块增删而失同步）。
   一级条目 = .detail-section（模块）；二级条目 = .doc-sec（正文分点的小节）。 */
function tocParts(){
  var body = el('termView').querySelector('.detail-body');
  if (!body) return null;
  return { body: body, nodes: body.querySelectorAll('.detail-section, .doc-sec') };
}
function buildToc(){
  var parts = tocParts();
  if (!parts) return;
  var body = parts.body, nodes = parts.nodes;
  var old = body.querySelector('.page-toc');
  if (old) old.parentNode.removeChild(old);
  if (nodes.length < 3) return;                 /* 短词条不出目录 */
  var chips = '';
  for (var i = 0; i < nodes.length; i++){
    var n = nodes[i];
    var isMain = n.className.indexOf('detail-section') >= 0;
    var label = '';
    if (isMain){
      var st = n.querySelector('.sec-title');
      /* sec-title 里可能追加说明 span（流说明/组成结构提示），只取第一个文本节点即纯标题 */
      if (st) label = (st.childNodes[0] && st.childNodes[0].nodeValue) ? st.childNodes[0].nodeValue : st.textContent;
    } else {
      var h3 = n.querySelector('h3');
      label = h3 ? h3.textContent : '';
    }
    label = String(label || '').replace(/\s+/g, ' ').trim();
    if (!label) continue;
    chips += '<button type="button" class="toc-chip' + (isMain ? '' : ' sub') +
      '" data-toc="' + i + '">' + esc(label) + '</button>';
  }
  if (!chips) return;
  var nav = document.createElement('nav');
  nav.className = 'page-toc';
  nav.setAttribute('aria-label', ts('tocTitle', '本页目录'));
  nav.innerHTML = '<span class="toc-title">' + esc(ts('tocTitle', '本页目录')) + '</span>' +
    '<div class="toc-chips">' + chips + '</div>';
  /* 插入位置（v1.1.3 改）：hero（标题 + 引文 + 定义 + 先知道/别名）之后、示意图之前。
     原来是「flow 之后，没有 flow 就放正文最前」，结果目录行压在 H1 上面——实测标题被顶到 y≈306
     （视口 1/4 处），层级读起来像「目录 → 标题」。hero 是 morph 的标定对象，刻意不往里插节点，
     所以改成插在它后面：阅读顺序变成 标题 → 目录 → 正文。 */
  var hero = body.querySelector('.detail-hero');
  var flow = body.querySelector('.flow-wrap');
  if (hero) body.insertBefore(nav, hero.nextSibling);
  else if (flow && flow.nextSibling) body.insertBefore(nav, flow.nextSibling);
  else body.insertBefore(nav, body.firstChild);
  /* v1.1.3：chips 的横向滚动不冒泡到 window（引擎的 scroll rAF 接不到），单独挂一个被动监听；
     目录每次重建都会换掉这个元素，监听随旧元素一起丢弃，不会累积 */
  var chipsBox = nav.querySelector('.toc-chips');
  if (chipsBox) chipsBox.addEventListener('scroll', syncTocFade, { passive: true });
  syncTocFade();                                 /* 目录刚插入即同步一次渐隐提示 */
}
/* v1.1.3：chip 行横向可滚动时，右缘给一层渐隐提示（纯装饰：不占位、不改排版）。
   开关由真实几何决定——右边还有内容才亮、滚到头就灭，不做「永远亮着」的假提示。 */
function syncTocFade(){
  var wrap = document.querySelector('.page-toc');
  if (!wrap) return;
  var box = wrap.querySelector('.toc-chips');
  if (!box) return;
  wrap.classList.toggle('toc-can-right', box.scrollWidth - box.clientWidth - box.scrollLeft > 2);
}
/* 滚动时高亮当前所在小节（挂在既有的 scroll rAF 里，与侧栏 scrollspy 同款做法） */
function syncTocActive(){
  var parts = tocParts();
  if (!parts) return;
  var nav = parts.body.querySelector('.page-toc');
  if (!nav) return;
  var nodes = parts.nodes, chips = nav.querySelectorAll('.toc-chip');
  var cur = -1;
  for (var i = 0; i < nodes.length; i++){
    if (nodes[i].getBoundingClientRect().top <= 96) cur = i;
  }
  for (var c = 0; c < chips.length; c++){
    chips[c].classList.toggle('on', parseInt(chips[c].getAttribute('data-toc'), 10) === cur);
  }
  syncTocFade();                    /* v1.1.3：同一帧里顺带同步右缘渐隐（滚动时它才会变） */
}

function renderTermView(){

    '<span class="topbar-actions">' +

       窄屏 → .entry-nav 变成 flex 行，它们落回顶栏下方（见「响应式」一节）
     ⚠️ 修正记录：此前多复制了一份固定浮标，桌面端出现两组导航；
     并且把 #termView 整个当成滑动体，连返回键都跟着滑——两处都是错的，已改。 */
  if (prev || next){

      ' aria-label="' + esc(ts('nextTerm', '下一条：' + esc(next.name), { n: esc(next.name) })) + '"' +
      ' title="' + esc(ts('nextTerm', '下一条：' + esc(next.name), { n: esc(next.name) })) + '">' +
      '<span class="fn-text">' + esc(next.name) + '</span><span class="fn-arrow" aria-hidden="true">→</span></button>';
    h += '</div>';
  }

  /* v4.1：正文单独包一层 .detail-body —— 左右滑动只作用于它。
     这一层边界是照参考站定的：它的 .detail-body 只包 hero 与各分节，
     顶栏与上下条在它外面，所以切上下条时顶部纹丝不动。
     v3：模块顺序按原站 8 页观测的主流次序校准——
     选择题/告诉 AI 在中部，常见变体位于组成结构之后、场景之前 */
  h += '<div class="detail-body">' +
    /* v5（2026-09-27 晚·方向一）：demoHtml 紧跟 hero——示意图归正文，morph 只带文字标题区；
       顺序 = 标题区 → 示意图 → 学习路径条 → 各分节（示意图视觉位置与旧版一致） */
    heroHtml(t) + demoHtml(t) + flowHtml(t) + sectionsHtml(t) + confusionsHtml(t) + quizHtml(t) +
    aiPromptHtml(t) + usageHtml(t) + anatomyHtml(t) + variantsHtml(t) + scenesHtml(t) +

  el('termView').innerHTML = h;

  el('topicView').hidden = true;
  syncTopbarStuck();        /* v4.1：详情重渲后刷新顶栏吸顶边框 */
  syncFloatAnchor();        /* v4.1：量出正文列位置，供固定浮标贴边 */
  buildToc();               /* v5：按渲染结果生成页内小节目录（必须在 innerHTML 之后） */
  syncTocActive();          /* v5：初始化目录高亮 */
  /* v3 修复 B7 + v4：标签页标题走可配置模板 */
  document.title = termTitleOf(t);
  /* v2：流程定位轮播初始定位在当前术语负责的步骤 */
  if (t.flow && t.flow.steps && t.flow.steps.length){
    flowGo((t.flow.current || 1) - 1);
  }
  /* v3：可操作演示落到初始状态（显隐 + 按钮禁用/高亮） */

/* ---------- 导航与 hash 路由 ---------- */
function goTopic(topicId, keepQ){
  state.topic = topicId || DEFAULT_TOPIC;
  state.term = null;
  state.favOnly = false;
  /* v5（2026-09-27 体验批次）：主题导航是普通视图入口，离开自测 / 对比页面级视图
     v5（2026-09-29 修复）：更新日志同属页面级视图，一并离开 */
  state.changelog = false;
  state.practice = false;
  state.compare = null;
  if (!keepQ){ state.q = ''; el('searchInput').value = ''; syncSearchUi(); }
  updateHash();
}
function goTerm(termId){
  /* v3：无效 id 不再只弹 toast——照常进入详情视图，由 renderTermView 渲染 404 态 */
  var t = termById(termId);
  if (t) state.topic = topicOfTerm(t);
  /* v4.1：记下切换方向，供视图过渡选关键帧（声明序更靠后的算 next） */
  if (lastViewWasTerm && state.term && state.term !== termId){
    vtDir = (topicIndexOf(termId) >= topicIndexOf(state.term)) ? 'next' : 'prev';
  } else vtDir = '';
  state.term = termId;
  state.favOnly = false;
  /* v5（2026-09-27 体验批次）：打开词条即离开自测 / 对比页面级视图
     v5（2026-09-29 修复）：更新日志同属页面级视图，一并离开 */
  state.changelog = false;
  state.practice = false;
  state.compare = null;
  updateHash();
}
function hashOf(){
  /* v5（2026-09-27 体验批次）：自测 / 对比是页面级视图，优先于 term/topic 产出 hash
     v5（2026-09-29 修复）：补上更新日志——此前遗漏，在更新日志页切换语言时（setLang + updateHash）
     hashOf 产出 #topic=… 导致「跳回词条页」。 */
  var target;
  if (state.compare) target = '#compare=' + state.compare[0] + ',' + state.compare[1];
  else if (state.practice) target = '#practice';
  else if (state.changelog) target = '#changelog';
  else if (state.term) target = '#term=' + state.term;
  else target = '#topic=' + (state.favOnly ? 'fav' : state.topic);
  /* v4：搜索词进 hash —— 搜索结果可分享、刷新不丢、返回键可回到上一次搜索 */
  if (state.q) target += '&q=' + encodeURIComponent(state.q);
  /* v4.1：英文界面进 hash —— 带 &lang=en 的链接分享出去对方看到的也是英文；zh 默认不写，URL 保持干净 */
  if (state.lang === 'en') target += '&lang=en';
  return state.debug ? target + '&debug' : target;
}
/* v5（2026-09-29 修复）：列表视图 hash——「返回图鉴」类链接专用（面包屑 / 顶栏「词条」/ logo）。
   hashOf 修好后会随页面级视图产出 #changelog，不能再被当作「回列表」链接使用 */
function listHashOf(){
  var t = '#topic=' + (state.favOnly ? 'fav' : state.topic);
  if (state.lang === 'en') t += '&lang=en';
  return t;
}
function updateHash(){
  var target = hashOf();
  if (location.hash !== target) location.hash = target;
  else renderApp();
}
function parseHash(){
  var body = (location.hash || '').replace(/^#/, '');
  /* v3 修复 B1：#debug 可单独出现，也可用 &debug 与 topic/term 共存 */
  state.debug = /(^|&)debug(&|$)/.test(body);
  body = body.replace(/(^|&)debug(&|$)/, '$1').replace(/&+$/, '');
  /* v4：取出搜索词 q。畸形百分号编码（如 %E4）不崩，原样保留 */
  state.q = '';
  var mq = body.match(/(^|&)q=([^&]*)/);
  if (mq){
    try { state.q = decodeURIComponent(mq[2]); } catch (e){ state.q = mq[2]; }
    body = body.replace(/(^|&)q=[^&]*/, '$1').replace(/&+$/, '');
  }
  /* v4.1：&lang=en / zh —— 可分享的界面语言参数；出现即记忆（localStorage 与 state 同步） */
  var ml = body.match(/(^|&)lang=(en|zh)(&|$)/);
  if (ml){
    setLang(ml[2]);
    body = body.replace(/(^|&)lang=(en|zh)(&|$)/, '$1').replace(/&+$/, '');
  }
  var m = body.match(/^term=([\w-]+)/);
  if (m){
    state.term = m[1];
    state.favOnly = false;
    var mt = termById(m[1]);
    if (mt) state.topic = topicOfTerm(mt);
    return;
  }
  state.term = null;
  /* v5（2026-09-26 工程线任务书①）：#changelog 更新日志视图——与 term/topic 互斥，#debug / &q / &lang 照常叠加。
     v5（2026-09-27 返工）：三个页面级态统一在匹配前重置——原先 changelog/compare 命中后直接 return，
     state.practice 会残留为 true，hashOf() 随即产出 #practice 的错误链接（面包屑/收藏等处） */
  state.changelog = false;
  state.practice = false;
  state.compare = null;
  m = body.match(/^changelog$/);
  if (m){ state.changelog = true; state.favOnly = false; return; }
  /* v5（2026-09-27 体验批次）：#practice 自测闪卡——与 term/topic 互斥，#debug / &q / &lang 照常叠加。
     进入时闪卡主题种子 = 当前 state.topic（fTopicId 在视图函数里消费） */
  m = body.match(/^practice$/);
  if (m){ state.practice = true; state.favOnly = false; fTopicId = state.topic; return; }
  /* v5（2026-09-27 体验批次）：#compare=a,b 词条并排对比——两侧 id 必须都存在且不同，否则落回主题视图 */
  m = body.match(/^compare=([\w-]+),([\w-]+)$/);
  if (m){
    var cmpA = termById(m[1]), cmpB = termById(m[2]);
    if (cmpA && cmpB && cmpA.id !== cmpB.id){ state.compare = [cmpA.id, cmpB.id]; state.favOnly = false; return; }
  }
  m = body.match(/^topic=([\w-]+)/);
  if (m){
    if (m[1] === 'fav'){ state.favOnly = true; return; }
    if (topicById(m[1])){ state.topic = m[1]; state.favOnly = false; return; }
  }
  if (!body){ state.topic = DEFAULT_TOPIC; state.favOnly = false; }
}
/* v2：列表滚动位置记忆——从详情返回列表时恢复到离开处 */
var lastViewWasTerm = false;
/* v4.1：列表滚动位置记忆，改为「记住被点那张卡片当时在视口里的高度」。
   参考站的做法（3766-…js）：离开时记 card.getBoundingClientRect().top，回来时按差值
   instant 滚回，那张卡片就落回它原来的视口位置。比记 scrollTop 稳——列表高度一变
   （已读标记、封面加载、字号差异），scrollTop 会把画面带到别处，而视口位置不变。 */
var savedCardId = null;
var savedScrollY = 0;
/* v3：返回列表后把焦点还给刚看过的那张卡片（仅 ← 返回 / Esc 触发） */
var returnFocusId = null;

/* ---------- v4.1：视图过渡的脚手架（动画定义在 CSS 的「视图过渡」一节） ---------- */
var vtDir = '';        /* 本次切换方向：open / next / prev / ''（回列表走默认淡入） */
var vtBusy = false;    /* 过渡进行中：此时再导航就直切，避免两次过渡打架 */
var vtSkip = false;    /* 置位则本次不做过渡（例如"在详情页点分类目录"这种跳跃式导航） */
/* v5（2026-09-29 修复）：语言切换是「同视图重渲」——记录切换前 scrollY（≥0 表示待恢复），
   paint 末尾恢复、renderApp 不再播导航动画；其余导航不走此通道 */
var preserveScroll = -1;
var vtGen = 0;         /* 过渡代际：只有最后一次开的过渡有权做收尾清理 */
var pendingCatGoto = null;   /* 待滚动到的分类锚点：由 paint() 在列表渲染完之后消费 */
/* ⚠️ 首屏必须绕过过渡：startViewTransition 的回调是**异步**的，
   若首屏也走它，页面要等下一帧才有内容（空窗 + 无源可 morph，纯亏）。 */
var vtPrimed = false;
function vtReduce(){
  try {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e){ return false; }
}
function vtSupported(){ return !!document.startViewTransition && !vtReduce(); }
/* 挂 / 卸 view-transition-name（传空即卸）。同一时刻同名只允许一个元素，所以必须一卸一挂 */
function vtName(sel, name){
  if (!sel) return null;
  var n = document.querySelector(sel);
  if (!n) return null;
  n.style.viewTransitionName = name || '';
  return n;
}
function vtClearNames(){
  vtName('#detail-hero', '');
  vtName('.detail-body', '');
  var cards = document.querySelectorAll('[data-card]');
  for (var i = 0; i < cards.length; i++) cards[i].style.viewTransitionName = '';
}
function topicIndexOf(id){
  var list = siblingsOf(termById(id));
  return siblingIndexOf(id, list);
}

/* 真正的渲染：所有 DOM 写入都在这里，过渡回调只负责挑时机调用它 */
function paint(){
  syncResumeBar();           /* v5（2026-09-27）：B1 继续上次——横幅只看最新 state，与内容渲染解耦 */
  renderSideNav();
  syncNavCurrent();         /* v5（任务书①）：顶栏 current 跟随视图 */
  /* v5（2026-09-26 使用者反馈）：changelog 是页面级视图——body 挂 is-changelog 后整页隐藏侧栏、主区居中。
     v5（2026-09-27 体验批次）：自测 / 对比同为页面级视图，复用同一整页形态（任务书拍板） */
  document.body.classList.toggle('is-changelog', !!(state.changelog || state.practice || state.compare));
  /* v3 修复 B1：#debug 时渲染自检报告，否则收起容器 */
  if (state.debug) renderDebug();
  else { el('debugReport').hidden = true; el('debugList').hidden = true; }
  if (state.term){
    if (!lastViewWasTerm && !el('topicView').hidden){
      var from = el('topicView').querySelector('[data-card="' + state.term + '"]');
      if (from){
        savedCardId = state.term;
        /* v5 修复（2026-09-27 报障一·morph 观感）：改记离开时的窗口 scrollY（而非卡片视口 top）。
           原实现里「进入时量」发生在 B1 横幅已隐藏之后、「返回时量」发生在横幅已显示之后，
           两个布局态相差一个横幅高度（实测 65px）→ 返回时 scrollTo 多滚 65px，
           滚动修正又与 morph 补间相互拉扯（返回方向 y 过冲 + 亚像素抖动）。
           scrollY 与布局无关，直接恢复即可，根治两症。取证见当轮过程记录。 */
        savedScrollY = window.scrollY || window.pageYOffset || 0;
      }
      else savedCardId = null;
    }
    renderTermView();
    window.scrollTo(0, 0);
    if (termById(state.term)) saveLast(state.term);   /* v5（2026-09-27）：B1——记录最后阅读的词条（404 态不记） */
    lastViewWasTerm = true;
  } else if (state.changelog){
    /* v5（2026-09-26 任务书①）：更新日志视图。渲染进 #topicView 容器——
       视图里没有 data-card 卡片，从详情页切入时 morph 找不到目标会自动退化为淡入，无需特判 */
    renderChangelogView();
    window.scrollTo(0, 0);
    lastViewWasTerm = false;
    savedCardId = null;
    savedScrollY = 0;
  } else if (state.practice){
    /* v5（2026-09-27 体验批次）：闪卡自测视图（件 2）——同 changelog 的页面级形态 */
    renderPracticeView();
    window.scrollTo(0, 0);
    lastViewWasTerm = false;
    savedCardId = null;
    savedScrollY = 0;
  } else if (state.compare){
    /* v5（2026-09-27 体验批次）：词条并排对比视图（件 4） */
    renderCompareView();
    window.scrollTo(0, 0);
    lastViewWasTerm = false;
    savedCardId = null;
    savedScrollY = 0;
  } else {
    renderTopicView();
    var placed = false;
    if (lastViewWasTerm && savedCardId){
      /* v5 修复（2026-09-27 报障一）：savedScrollY 现在就是离开时的窗口 scrollY（见上方存取处注释），
         直接恢复即可——不再量卡片 rect，横幅显隐的布局差不再污染滚动恢复，morph 也不再被滚动修正拉扯。 */
      window.scrollTo(0, Math.max(0, savedScrollY));
      placed = true;
    }
    if (!placed) window.scrollTo(0, 0);
    /* v4.1：从详情页点侧栏分类进来的，列表渲染完之后再滚到那一段 */
    if (pendingCatGoto){
      var psec = document.getElementById(pendingCatGoto);
      pendingCatGoto = null;
      if (psec) psec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (returnFocusId){
      /* v4：卡片标题已是链接，焦点要落在链接上（卡片本身不可聚焦） */
      var fc = el('topicView').querySelector('[data-card="' + returnFocusId + '"] .card-link');
      if (fc) fc.focus({ preventScroll: true });
      returnFocusId = null;
    }
    lastViewWasTerm = false;
    savedCardId = null;
    savedScrollY = 0;
  }
  closeDrawer();
  /* v5（2026-09-29 修复）：同视图重渲（语言切换）——恢复切换前的滚动位置。
     放在最后执行，覆盖各分支里的 scrollTo(0,0)；同一任务内后一次 scrollTo 生效，不闪屏。 */
  if (preserveScroll >= 0){
    var psY = preserveScroll;
    preserveScroll = -1;
    window.scrollTo(0, psY);
  }
  vtPrimed = true;      /* 首屏已落地，之后的切换才有必要做过渡 */
}

/* v4.1：带视图过渡的渲染入口。三个场景与 CSS 的 data-dir 关键帧一一对应：
     列表 → 详情   data-dir=open      卡片 morph 成 #detail-hero，正文从下方浮起
     详情 → 列表   data-dir=''        #detail-hero morph 回那张卡片
     详情 → 详情   data-dir=next|prev 只有正文左右滑 */
function renderApp(){
  var wasTerm = lastViewWasTerm;
  var entering = !!state.term;
  var fromList = entering && !wasTerm;
  var toList = !entering && wasTerm;
  var across = entering && wasTerm;

  /* v5（2026-09-29 修复）：语言切换属「同视图重渲」——不播导航动画
     （详情页此前会误播「下一条」滑动），滚动位置由 paint 末尾恢复（见 preserveScroll） */
  if (preserveScroll >= 0){ fromList = false; toList = false; across = false; }

  var dir = '', aSel = null, aName = '', bSel = null, bName = '';
  if (fromList){
    dir = 'open';
    aSel = state.term ? '[data-card="' + state.term + '"]' : null;
    aName = 'morph'; bSel = '#detail-hero'; bName = 'morph';
  } else if (toList && savedCardId){
    dir = '';
    aSel = '#detail-hero'; aName = 'morph';
    bSel = '[data-card="' + savedCardId + '"]'; bName = 'morph';
  } else if (across){
    dir = vtDir || 'next';
    /* ⚠️ 滑动体是 .detail-body（只含 hero 与各分节），不是 #termView。
       参考站的 .detail-body 同样把顶栏与上下条排除在外——所以切上下条时
       返回键、收藏、复制、搜索框这些都不动。v4.1 初版写成 #termView 是错的。 */
    aSel = '.detail-body'; aName = 'detail-body';
    bSel = '.detail-body'; bName = 'detail-body';
  }
  vtDir = '';

  /* v5 修复（2026-09-20）：滚离顶部后跨词条切换不播滑动过渡。
     根因：paint() 会渲染新词条并滚回顶部，而 View Transition 的旧快照是"你当前在页面中部
     看到的画面"、新快照是"顶部画面"——两张快照的垂直差被一并补间，叠加原本设计的水平滑动，
     就成了所报的「斜向」过渡。页面顶部附近切换时两张快照位置一致，动画正常，故保留。
     阈值取半屏（240px）：滚过它基本意味着正在长文里读，此时要的是"直接到新词条"。 */
  if (across && (window.scrollY || window.pageYOffset || 0) > 240) vtSkip = true;

  if (vtSkip){ vtSkip = false; paint(); return; }   /* 跳跃式导航（如点分类目录）不做过渡 */
  /* 注意：**不把 vtBusy 当直切条件**。过渡没跑完就再点，若直切 DOM，
     上一次的动画仍会继续播完——于是"点往右、看到的却是在往左"，这正是所报的方向异常。
     正确做法是照常开新过渡：规范里新的 startViewTransition 会自动 skip 掉上一个，
     方向取最新一次点击的，data-dir 也跟着最新。 */
  if (!vtPrimed || !vtSupported()){ paint(); return; }

  /* 开新过渡前先清一遍名字：上一次过渡若被 skip 掉，它的 done() 不会执行，
     残留的同名元素会被这次过渡当成额外参与元素，出现莫名的额外动画。 */
  vtClearNames();
  var a = vtName(aSel, aName);
  if (a) a.offsetWidth;                          /* ② 强制重排，确立起始快照 */
  if (dir) document.documentElement.setAttribute('data-dir', dir);
  else document.documentElement.removeAttribute('data-dir');

  var myGen = ++vtGen;                           /* 代际：只有最新一次过渡有权收尾 */
  vtBusy = true;
  var painted = false;
  function paintOnce(){ if (!painted){ painted = true; paint(); } }
  function done(){
    if (myGen !== vtGen) return;                 /* 已被更新的过渡接管，别去清它的名字 */
    vtBusy = false;
    vtClearNames();
    document.documentElement.removeAttribute('data-dir');
    syncFloatAnchor();
  }
  var tr = null;
  try {
    tr = document.startViewTransition(function(){
      vtName(aSel, '');                          /* ① 同名唯一：先把起点卸掉 */
      paintOnce();
      vtName(bSel, bName);
      if (fromList) vtName('.detail-body', 'detail-enter');
    });
  } catch (e){ tr = null; }
  if (!tr){ paintOnce(); done(); return; }       /* API 抛错也要照常渲染 */
  /* 兜底：回调理论上在下一帧就会被调用，但"没被调用"是会发生的
     （实测无头 + 虚拟时间下就不触发）。250ms 还没渲染就自己补一次，
     否则页面会停在旧视图上不动——功能正确性优先于动画。 */
  setTimeout(function(){ if (myGen === vtGen && !painted){ paintOnce(); done(); } }, 250);
  /* 第二道兜底：finished 理论上会在动画结束时兑现（约 0.45s）。
     万一它不兑现，名字会一直挂在那儿、污染下一次过渡，所以到点强制收尾一次。 */
  setTimeout(function(){ if (myGen === vtGen && painted) done(); }, 1200);
  if (tr.finished && tr.finished.then) tr.finished.then(done, done);
  else done();
  if (tr.ready && tr.ready.catch) tr.ready.catch(function(){});
  if (tr.finished && tr.finished.catch) tr.finished.catch(function(){});
}

/* ---------- 事件绑定（全局委托） ---------- */
function bindEvents(){
  document.addEventListener('click', function(ev){
    var node = ev.target;
    while (node && node !== document.body){
      var ds = node.dataset || {};

      if (ds.fav){                       /* 收藏 */
        ev.stopPropagation();
        toggleFav(ds.fav);
        var ft = termById(ds.fav);
        var fname = ft ? ft.name : ds.fav;
        toast(isFav(ds.fav) ? ts('favToastOn', '已收藏：' + fname, { n: fname }) : ts('favToastOff', '已取消收藏：' + fname, { n: fname }));
        if (state.favOnly){ renderApp(); return; }   /* 收藏视图里取消后条目需消失 */
        /* v3 修复 B6 + v4：局部更新星标与侧栏计数，避免全量重渲染导致卡片动画重播、焦点丢失；
           状态属性统一走 syncFavBtn，与全量渲染结果保持一致 */
        var fbtns = document.querySelectorAll('[data-fav="' + ds.fav + '"]');
        for (var fb = 0; fb < fbtns.length; fb++){ syncFavBtn(fbtns[fb], ds.fav); }
        renderSideNav();
        return;
      }
      if (ds.card){                      /* v4 修复 B8：整卡可点（此前只有标题可点） */
        ev.stopPropagation();
        goTerm(ds.card);
        return;
      }
      if (ds.color){                     /* v4：主题色菜单选项 */
        ev.stopPropagation();
        setColor(ds.color);
        closeColorMenu(true);
        return;
      }
      if (ds.term){                      /* 打开词条（卡片/互链/上下条/接下来学什么） */
        ev.stopPropagation();
        /* v4：标题已是真链接，拦掉默认跳转，避免「委托 + hashchange」双重渲染 */
        if (ev.preventDefault) ev.preventDefault();
        goTerm(ds.term);
        return;
      }
      if (ds.toc !== undefined){         /* v5：页内小节目录 → 滚动到对应模块 / 小节 */
        ev.stopPropagation();
        var tocRes = tocParts();
        var tocNode = tocRes ? tocRes.nodes[parseInt(ds.toc, 10)] : null;
        if (tocNode) tocNode.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (ds.catgoto){                   /* v4.1：侧栏分类目录，平滑滚动到对应分节 */
        ev.stopPropagation();
        if (state.term){
          /* 在详情页点到分类：先回列表，锚点交给 paint() 在渲染完之后消费 */
          pendingCatGoto = ds.catgoto;
          vtSkip = true;
          state.term = null;
          updateHash();
          return;
        }
        var sec = document.getElementById(ds.catgoto);
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (ds.demoStep !== undefined || ds.demoTo !== undefined){   /* v3：可操作演示切状态 */
        ev.stopPropagation();
        var live = node.closest('.dk-live');
        var lt = live ? termById(live.getAttribute('data-term')) : null;
        if (live && lt && lt.demoCtl){
          var cur = parseInt(live.getAttribute('data-st'), 10) || 0;
          var ns = ds.demoTo !== undefined
            ? parseInt(ds.demoTo, 10)
            : cur + parseInt(ds.demoStep, 10);
          demoSet(live, lt.demoCtl, ns);
        }
        return;
      }
      if (ds.clfilter){                  /* v5（2026-09-26）：changelog 分类筛选——切 state 后重渲染（指示器随渲染重新定位） */
        ev.stopPropagation();
        state.clFilter = ds.clfilter;
        renderApp();
        return;
      }
      if (ds.clmonth){                   /* v5（2026-09-26）：changelog 侧栏时间定位——滚动到该月第一条 */
        ev.stopPropagation();
        var msec = document.getElementById('cl-m-' + ds.clmonth);
        if (msec) msec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (ds.zoom){                      /* v5（2026-09-27 体验批次·件 3）：demo 可视区点击 → 放大遮罩 */
        ev.stopPropagation();
        openZoom(node);
        return;
      }
      if (ds.ddtoggle !== undefined){    /* v5（2026-09-27 体验批次）：自绘下拉开合（自测选主题 / 详情页选对比词条） */
        ev.stopPropagation();
        var ddBox = node.closest('.dd');
        if (ddBox){
          var willOpen = !ddBox.classList.contains('open');
          closeAllDds();
          ddBox.classList.toggle('open', willOpen);
          var ddBtnEl = ddBox.querySelector('.dd-btn');
          if (ddBtnEl) ddBtnEl.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        }
        return;
      }
      if (ds.ddpick){                    /* v5（2026-09-27 体验批次）：下拉选项——按宿主 data-dd 分派 */
        ev.stopPropagation();
        var ddHost = node.closest('.dd');
        var ddKind = ddHost ? ddHost.getAttribute('data-dd') : '';
        var ddVal = ds.ddpick;
        closeAllDds();
        if (ddKind === 'practiceTopic') practiceSetTopic(ddVal);
        else if (ddKind === 'comparePick' && state.term) goCompare(state.term, ddVal);
        return;
      }
      if (ds.topic){                     /* 切换主题 */
        ev.stopPropagation();
        if (ev.preventDefault) ev.preventDefault();   /* v4：导航项已是真链接 */
        goTopic(ds.topic);
        return;
      }
      if (ds.favmode){                   /* 只看收藏 */
        ev.stopPropagation();
        state.favOnly = !state.favOnly;
        state.term = null;
        /* v5（2026-09-29 修复）：收藏是普通视图入口——离开页面级视图（更新日志 / 自测 / 对比） */
        state.changelog = false;
        state.practice = false;
        state.compare = null;
        updateHash();
        return;
      }
      if (ds.back){                      /* 返回列表 */
        ev.stopPropagation();
        returnFocusId = state.term;      /* v3：返回后焦点还给刚看过的卡片 */
        state.term = null;
        updateHash();
        return;
      }
      if (ds.copymd){                    /* 复制为 Markdown */
        ev.stopPropagation();
        var ct = termById(ds.copymd);
        if (ct) copyText(markdownOf(ct), ts('copiedMd', '已复制为 Markdown'));
        return;
      }
       if (ds.copy){                      /* 复制 AI prompt */
         ev.stopPropagation();
         copyText(ds.copy, ts('copied', '已复制'));
        return;
      }
      if (ds.pron){                      /* 朗读英文名（浏览器本地语音） */
        ev.stopPropagation();
        speak(ds.pron);
        return;
      }
      if (ds.flowPrev !== undefined){    /* v2：流程轮播上一步 */
        ev.stopPropagation();
        flowGo(flowIdx - 1);
        return;
      }
      if (ds.flowNext !== undefined){    /* v2：流程轮播下一步 */
        ev.stopPropagation();
        flowGo(flowIdx + 1);
        return;
      }
      if (ds.flowGo !== undefined){      /* v2：流程点阵直达某一步 */
        ev.stopPropagation();
        flowGo(parseInt(ds.flowGo, 10));
        return;
      }
      if (ds.quizAgain){                 /* v2：选择题再试一次 */
        ev.stopPropagation();
        var quizWrap = node.closest('.quiz-wrap');
        if (quizWrap){
          quizWrap.classList.remove('done');
          var qopts = quizWrap.querySelectorAll('.quiz-opt');
          for (var r2 = 0; r2 < qopts.length; r2++){
            qopts[r2].classList.remove('ok', 'no', 'dimmed');
          }
        }
        return;
      }
      if (ds.apartBtn){                  /* 组成结构联动高亮（v4：改调 setAnatomy，与 Esc 解锁共用） */
        ev.stopPropagation();
        var wrap = node.closest('.anat-wrap');
        if (wrap){
          var active = wrap.getAttribute('data-anat') === String(ds.apartBtn);
          setAnatomy(wrap, active ? null : ds.apartBtn);
        }
        return;
      }
      if (ds.opt !== undefined && node.classList.contains('quiz-opt')){   /* 选择题判定 */
        ev.stopPropagation();
        var quiz = node.closest('.quiz-wrap');
        if (quiz.classList.contains('done')) return;
        quiz.classList.add('done');
        var opts = quiz.querySelectorAll('.quiz-opt');
        for (var q = 0; q < opts.length; q++){
          var right = opts[q].getAttribute('data-right') === '1';
          if (right){ opts[q].classList.add('ok'); }
          else if (opts[q] === node){ opts[q].classList.add('no'); }
          else { opts[q].classList.add('dimmed'); }
        }
        return;
      }
      node = node.parentNode;
    }
  });

  /* 搜索：150ms 防抖后过滤（v2：全局搜索，详情页输入则回到列表） */
  var searchDeb = null;
  el('searchInput').addEventListener('input', function(){
    var v = this.value;
    clearTimeout(searchDeb);
    searchDeb = setTimeout(function(){
      state.q = v.trim();
      /* v4：详情页输入搜索 = 回到列表看搜索结果 */
      if (state.term) state.term = null;
      /* v5（2026-09-29 修复）：搜索是全局动作——离开页面级视图（更新日志 / 自测 / 对比） */
      state.changelog = false;
      state.practice = false;
      state.compare = null;
      /* v4：搜索词同步进 URL。用 replaceState 不进历史，避免逐击键污染返回键；
         file:// 下个别浏览器不支持时静默降级，页面行为不受影响 */
      try { history.replaceState(null, '', hashOf()); } catch (e){}
      syncSearchUi();
      renderApp();
    }, 150);
  });
  el('searchClear').addEventListener('click', function(){
    clearTimeout(searchDeb);
    el('searchInput').value = '';
    state.q = '';
    try { history.replaceState(null, '', hashOf()); } catch (e){}
    syncSearchUi();
    renderApp();
  });
  el('searchInput').addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){ el('searchClear').click(); this.blur(); }
  });

  /* v2：全局键盘——Ctrl/⌘+K 聚焦搜索；详情页 ←/→ 在同类目内环状切词条；Enter 打开焦点项
     v4：Esc 改为逐层退出（色板 → 抽屉 → 部件锁定 → 退出详情）；
         ↑/↓ 在主题色菜单内移动选项；互链 / 胶囊 Enter 或 Space 打开 */
  document.addEventListener('keydown', function(ev){
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')){
      ev.preventDefault();
      el('searchInput').focus();
      el('searchInput').select();
      return;
    }
    var ae = document.activeElement;
    var tag = ae ? ae.tagName : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    /* v4：弹出菜单（色板 / 语言）内 ↑/↓ 在选项间移动焦点 */
    if ((colorMenuOpen() || langMenuOpen()) && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
      var popHost = colorMenuOpen() ? el('colorPop') : el('langPop');
      var items = popHost.querySelectorAll('.color-item,.lang-item');
      if (items.length){
        ev.preventDefault();
        var ii = -1;
        for (var ci0 = 0; ci0 < items.length; ci0++){ if (items[ci0] === ae){ ii = ci0; break; } }
        var ci1 = ii === -1 ? 0
          : (ev.key === 'ArrowDown' ? Math.min(ii + 1, items.length - 1) : Math.max(ii - 1, 0));
        items[ci1].focus();
      }
      return;
    }

    /* v5（2026-09-26）：`/` 聚焦搜索——Ctrl/⌘+K 的轻量替代（文档站惯例；上方卫语句保证此处已在非输入态） */
    if (ev.key === '/'){
      ev.preventDefault();
      el('searchInput').focus();
      return;
    }

    /* v5（2026-09-27）：? 呼出快捷键帮助（再按 ? 或 Esc 关闭；输入态已被上方卫语句拦下） */
    if (ev.key === '?'){
      ev.preventDefault();
      if (kbdOpen()) closeKbdHelp(true); else openKbdHelp();
      return;
    }

    if (ev.key === 'Escape'){
      /* v4：Esc 优先级链——放大镜 → 帮助面板 → 色板 → 语言菜单 → 移动端抽屉 → 自绘下拉 → 部件锁定 → 退出详情回列表
         v5（2026-09-27 体验批次）：zoom 链最前（任务书拍板）；自测 / 对比视图 Esc 退回列表 */
      if (zoomIsOpen()){ closeZoom(); return; }
      if (kbdOpen()){ closeKbdHelp(true); return; }
      if (colorMenuOpen()){ closeColorMenu(true); return; }
      if (langMenuOpen()){ closeLangMenu(true); return; }
      if (el('sideNav').classList.contains('open')){ closeDrawer(); return; }

/* v5（2026-10-01 手机端顶栏横向溢出修复·方案 A）：窄屏顶栏按钮收纳。
   v1.1.3：三个控件改为**分开判**——
     ① 快捷键帮助 #kbdBtn：≤960 一律收进汉堡抽屉。触屏设备没有键盘快捷键，留在顶栏只占位。

        顺带修掉「收藏 · 中文」贴在一起像一组的问题：第二行现在只剩「导航 + 收藏」。
   搬动只搬节点、不复制副本，也不重绑事件——监听器挂在节点上，跟着节点走，所以色板/帮助面板的
   开合、Esc 优先级链、点外部关闭等逻辑全部沿用原样。幂等：已在目标位置就不动。 */
var mqNarrow = window.matchMedia ? window.matchMedia('(max-width: 960px)') : null;
/* v1.1.3（续 10）：导航/收藏搬进底部 tab 栏的断点单独拆出来（≤860），
   与「单行顶栏 + 侧栏进抽屉 + 快捷键收进抽屉」的 ≤960 解耦——
   861–960 顶栏放得下导航（实测零溢出），不该跟着一起收走。 */
var mqNav = window.matchMedia ? window.matchMedia('(max-width: 860px)') : null;
var mqPhone = window.matchMedia ? window.matchMedia('(max-width: 560px)') : null;
function syncHeaderTools(){
  var tools = el('drawerTools'), color = el('navColor'), kbd = el('kbdBtn'), theme = el('themeBtn'), lang = el('langSw');
  if (!tools || !color || !kbd || !theme) return;
  var nav = theme.parentNode;
  if (!nav) return;
  var narrow = !!(mqNarrow && mqNarrow.matches);
  var navNarrow = !!(mqNav && mqNav.matches);
  var phone = !!(mqPhone && mqPhone.matches);
  /* v1.1.3：三个控件、两个断点分开判，且必须按 DOM 原序（语言 → 主题色 → 快捷键）依次处理——
     回顶栏一律 insertBefore(节点, 明暗按钮)，按原序插入才恢复得了原顺序。 */
  if (lang && (lang.parentNode === tools) !== phone){
    if (phone){
      if (langMenuOpen()) closeLangMenu(false);   /* 搬动前收起菜单，避免浮层跟着节点跳位 */
      tools.appendChild(lang);
    } else nav.insertBefore(lang, theme);
  }
  if ((color.parentNode === tools) !== phone){
    if (phone){
      if (colorMenuOpen()) closeColorMenu(false);
      tools.appendChild(color);
    } else nav.insertBefore(color, theme);
  }
  if ((kbd.parentNode === tools) !== narrow){
    if (narrow) tools.appendChild(kbd);
    else nav.insertBefore(kbd, theme);
  }
      /* v1.1.3（手机端顶栏重排）：≤860 再把「主导航 + 收藏」搬到底部 tab 栏——顶栏因此只剩一行。
      断点与 CSS 的 @media (max-width:860px) 一致（原注释写 ≤560，续 9 改为 ≤960，续 10 随断点改为 ≤860）。
      回顶栏时按原 DOM 顺序落位：导航插在搜索框之前，收藏插在语言控件之前（语言此时已先归位）。 */
  var tabs = el('tabBar');
  var links = el('navLinks'), fav = el('navFav'), search = el('navSearch');
  if (tabs && links && fav && search){
    if (navNarrow){
      if (links.parentNode !== tabs) tabs.appendChild(links);
      if (fav.parentNode !== tabs) tabs.appendChild(fav);
    } else {
      if (links.parentNode === tabs) nav.insertBefore(links, search);
      if (fav.parentNode === tabs) nav.insertBefore(fav, lang || theme);
    }
    tabs.hidden = links.parentNode !== tabs;
  }
  tools.hidden = !(color.parentNode === tools || kbd.parentNode === tools || (lang && lang.parentNode === tools));
}
function openDrawer(){
  var nav = el('sideNav');

function closeDrawer(){

  var wasOpen = nav.classList.contains('open');
  /* v5（2026-10-01 方案 A）：色板现在住在抽屉里——抽屉收起时它必须一并关闭，

  if (colorMenuOpen()) closeColorMenu(false);

/* ---------- 朗读（SpeechSynthesis 离线可用，无则静默） ---------- */
function speak(text){
  try {
    if (!window.speechSynthesis){ toast(ts('speakNo', '当前浏览器不支持朗读')); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e){ toast(ts('speakErr', '朗读不可用')); }
}

/* ---------- 数据自检（v3 修复 B1：#debug 开启，把 README 校验清单自动化）
   v4 扩展：配置区 / 主题色表 / 标题模板 / 模块标题表 / 必填项 / id 合法性 /
   互链扫描范围 / demo 与结论句配套 / data-at* 取值域 / 各模块完整性
   分级原则：悬空引用、必填缺失、类型错误 = err；风格与完整度 = warn。 ---------- */
var ID_RX = /^[a-z0-9-]+$/;
function validateData(){
  var issues = [];
  var seen = {}, seenTopic = {}, seenCat = {};

  /* ---- 模块配置区 ---- */
  if (!KB_TERMS.length) issues.push({ lv: 'err', msg: 'KB_TERMS 为空，没有任何词条' });
  /* v5：英文分册（可选）的每条 id 必须能在中文主表命中，否则该词的合并会静默失效 */
  if (typeof KB_TERMS_EN !== 'undefined' && KB_TERMS_EN){
    var seenEn = {};
    for (var ei = 0; ei < KB_TERMS_EN.length; ei++){
      var et = KB_TERMS_EN[ei];
      if (!et.id) issues.push({ lv: 'err', msg: '英文分册第 ' + (ei + 1) + ' 条缺 id' });
      else if (!termById(et.id)) issues.push({ lv: 'err', msg: '英文分册词条 id 不在中文表：' + et.id });
      else if (seenEn[et.id]) issues.push({ lv: 'err', msg: '英文分册 id 重复：' + et.id });
      else seenEn[et.id] = 1;
    }
  }
  for (var ti = 0; ti < TOPICS.length; ti++){
    var tpv = TOPICS[ti];
    if (!tpv.id) issues.push({ lv: 'err', msg: '主题第 ' + (ti + 1) + ' 项缺 id' });
    else if (seenTopic[tpv.id]) issues.push({ lv: 'err', msg: '主题 id 重复：' + tpv.id });
    else seenTopic[tpv.id] = 1;
    if (!tpv.name) issues.push({ lv: 'warn', msg: '主题「' + (tpv.id || (ti + 1)) + '」缺 name' });
  }
  for (var cj = 0; cj < CATEGORIES.length; cj++){
    var cg = CATEGORIES[cj];
    if (!cg.id) issues.push({ lv: 'err', msg: '分类第 ' + (cj + 1) + ' 项缺 id' });
    else if (seenCat[cg.id]) issues.push({ lv: 'err', msg: '分类 id 重复：' + cg.id });
    else seenCat[cg.id] = 1;
    if (!topicById(cg.topic)) issues.push({ lv: 'err', msg: '分类「' + cg.name + '」挂在不存在的主题：' + cg.topic });
  }
  if (!topicById(DEFAULT_TOPIC)) issues.push({ lv: 'err', msg: 'DEFAULT_TOPIC 指向不存在的主题：' + DEFAULT_TOPIC });

  /* ---- SITE_META 与标题模板 ---- */
  var sm = SITE_META || {};
  if (!sm.pageTitle) issues.push({ lv: 'warn', msg: 'SITE_META.pageTitle 为空，标签页标题会留白' });
  var tplNames = ['titleTemplate', 'notFoundTitle', 'searchTitle'];
  for (var tc = 0; tc < tplNames.length; tc++){
    var tv = sm[tplNames[tc]] || '';
    if (tv.indexOf('{brand}') < 0 && tv.indexOf('{name}') < 0 && tv.indexOf('{q}') < 0){
      issues.push({ lv: 'warn', msg: 'SITE_META.' + tplNames[tc] + ' 不含任何占位符（{brand}/{name}/{q}）：' + tv });
    }
  }
  if (sm.navLinks){
    for (var nl = 0; nl < sm.navLinks.length; nl++){
      if (!sm.navLinks[nl].label) issues.push({ lv: 'warn', msg: 'SITE_META.navLinks[' + nl + '] 缺 label' });
      if (!sm.navLinks[nl].href && !sm.navLinks[nl].current) issues.push({ lv: 'warn', msg: 'SITE_META.navLinks[' + nl + '] 既无 href 也非 current，会渲染成不可点击的链接' });
    }
  }

  /* ---- v5（2026-09-26 任务书①）：CHANGELOG 自检——防悬空词条引用，兼查字段与日期倒序 ---- */
  if (typeof CHANGELOG === 'undefined'){
    issues.push({ lv: 'warn', msg: 'CHANGELOG 未定义（更新日志视图将显示空态）；启用请在 content/更新日志.js 提供数据' });
  } else if (!(CHANGELOG instanceof Array)){
    issues.push({ lv: 'err', msg: 'CHANGELOG 必须是数组' });
  } else {
    if (!CHANGELOG.length) issues.push({ lv: 'warn', msg: 'CHANGELOG 为空（更新日志视图将显示空态）' });
    var clDateRx = /^\d{4}-\d{2}-\d{2}$/;
    for (var ci = 0; ci < CHANGELOG.length; ci++){
      var cl = CHANGELOG[ci] || {}, clTag = '更新日志第 ' + (ci + 1) + ' 条';
      if (!cl.date || !clDateRx.test(cl.date)) issues.push({ lv: 'err', msg: clTag + ' date 缺失或非 YYYY-MM-DD：' + (cl.date || '') });
      if (!cl.title) issues.push({ lv: 'err', msg: clTag + ' 缺 title' });
      if (cl.kind && cl.kind !== 'update' && cl.kind !== 'terms') issues.push({ lv: 'err', msg: clTag + ' kind 必须是 update 或 terms：' + cl.kind });
      if (cl.items && !(cl.items instanceof Array)) issues.push({ lv: 'err', msg: clTag + ' items 必须是数组' });
      if (cl.terms && !(cl.terms instanceof Array)) issues.push({ lv: 'err', msg: clTag + ' terms 必须是数组' });
      if (cl.terms instanceof Array){
        for (var cj = 0; cj < cl.terms.length; cj++){
          if (!termById(cl.terms[cj])) issues.push({ lv: 'err', msg: clTag + ' terms 引用不存在的词条：' + cl.terms[cj] });
        }
      }
    }
    for (var ck = 1; ck < CHANGELOG.length; ck++){
      if (String((CHANGELOG[ck - 1] || {}).date) < String((CHANGELOG[ck] || {}).date)){
        issues.push({ lv: 'warn', msg: '更新日志第 ' + ck + ' 条日期早于第 ' + (ck + 1) + ' 条（应按日期倒序）' });
      }
    }
  }

  /* ---- v5（2026-09-29 更新日志英文版）：CHANGELOG_EN 自检——按「日期 + 同日序号」与中文对齐；
         缺条只提示（引擎回退中文），对不上中文 / 引用悬空 / 中文残留为错误 ---- */
  if (typeof CHANGELOG_EN !== 'undefined' && CHANGELOG_EN !== null){
    if (!(CHANGELOG_EN instanceof Array)){
      issues.push({ lv: 'err', msg: 'CHANGELOG_EN 必须是数组或 null' });
    } else {
      var enDateRx = /^\d{4}-\d{2}-\d{2}$/, enCjkRx = /[\u4e00-\u9fff]/;
      var enZhCount = {}, enCount2 = {};
      if (CHANGELOG instanceof Array){
        for (var zi = 0; zi < CHANGELOG.length; zi++){
          var zd2 = String((CHANGELOG[zi] || {}).date || '');
          enZhCount[zd2] = (enZhCount[zd2] || 0) + 1;
        }
      }
      for (var ei = 0; ei < CHANGELOG_EN.length; ei++){
        var ec = CHANGELOG_EN[ei] || {}, etag = '更新日志英文第 ' + (ei + 1) + ' 条';
        var ed = String(ec.date || '');
        enCount2[ed] = (enCount2[ed] || 0) + 1;
        if (!enDateRx.test(ed)) issues.push({ lv: 'err', msg: etag + ' date 缺失或非 YYYY-MM-DD：' + ed });
        else if (!enZhCount[ed] || enCount2[ed] > enZhCount[ed]) issues.push({ lv: 'err', msg: etag + ' 日期对不上中文：' + ed + '（同日第 ' + enCount2[ed] + ' 条）' });
        if (!ec.title) issues.push({ lv: 'err', msg: etag + ' 缺 title' });
        if (ec.terms instanceof Array){
          for (var ej = 0; ej < ec.terms.length; ej++){
            if (!termById(ec.terms[ej])) issues.push({ lv: 'err', msg: etag + ' terms 引用不存在的词条：' + ec.terms[ej] });
          }
        }
        if (enCjkRx.test(String(ec.title || '') + ' ' + (ec.items || []).join(' '))) issues.push({ lv: 'err', msg: etag + ' 含中文字符（英文条目不应含中文）' });
      }
      var enMissing = 0;
      for (var zk2 in enZhCount){
        if (enZhCount.hasOwnProperty(zk2) && (enCount2[zk2] || 0) < enZhCount[zk2]) enMissing++;
      }
      if (enMissing) issues.push({ lv: 'warn', msg: 'CHANGELOG_EN 有 ' + enMissing + ' 组日期未译（该部分回退中文；目标中英同补）' });
    }
  }

  /* ---- 主题色表 ---- */
  var ctable = colorTable();
  var ckeys = 0;
  for (var ck in ctable){ if (ctable.hasOwnProperty(ck)) ckeys++; }
  if (!ckeys) issues.push({ lv: 'err', msg: '主题色表为空，色板将没有任何选项' });
  for (var ci = 0; ci < COLOR_KEYS.length; ci++){
    var c0 = ctable[COLOR_KEYS[ci]];
    if (!c0){ issues.push({ lv: 'err', msg: '主题色缺键：' + COLOR_KEYS[ci] }); continue; }
    if (!c0.name) issues.push({ lv: 'warn', msg: '主题色「' + COLOR_KEYS[ci] + '」缺中文名 name' });
    if (!(c0.l && c0.l.length >= 3) || !(c0.d && c0.d.length >= 3)){
      issues.push({ lv: 'err', msg: '主题色「' + COLOR_KEYS[ci] + '」的 l / d 需各含 3 个值（brand / hover / tint）' });
    }
  }
  var defColor = sm.themeDefault || 'klein';
  if (!ctable[defColor]) issues.push({ lv: 'err', msg: 'SITE_META.themeDefault 不在主题色表内：' + defColor });

  /* ---- 模块标题唯一来源 ---- */
  var titleKeys = ['sections', 'confusions', 'quiz', 'aiPrompt', 'usage', 'usageDo', 'usageDont',
    'anatomy', 'variants', 'scenes', 'flow', 'next', 'refs', 'favList', 'notFound', 'tips'];
  for (var tk = 0; tk < titleKeys.length; tk++){
    if (!MODULE_TITLES[titleKeys[tk]]) issues.push({ lv: 'warn', msg: 'MODULE_TITLES 缺键：' + titleKeys[tk] });
  }

  /* ---- 逐条词条 ---- */
  for (var i = 0; i < KB_TERMS.length; i++){
    var t = KB_TERMS[i];
    var tag = t.name || t.id || ('第 ' + (i + 1) + ' 条');

    if (!t.id) issues.push({ lv: 'err', msg: '第 ' + (i + 1) + ' 条词条缺 id' });
    else if (!ID_RX.test(t.id)) issues.push({ lv: 'err', msg: '「' + tag + '」id 含非法字符（hash 路由只认小写字母/数字/连字符）：' + t.id });
    if (seen[t.id]) issues.push({ lv: 'err', msg: '词条 id 重复：' + t.id });
    seen[t.id] = 1;
    if (!t.name) issues.push({ lv: 'err', msg: '「' + tag + '」缺 name（必填）' });
    if (!t.definition) issues.push({ lv: 'err', msg: '「' + tag + '」缺 definition（必填）' });
    if (t.aliases && !(t.aliases instanceof Array)) issues.push({ lv: 'err', msg: '「' + tag + '」aliases 必须是数组' });

    var tp = topicOfTerm(t);
    if (!tp || !topicById(tp)) issues.push({ lv: 'err', msg: '「' + tag + '」无有效主题归属（cat 与 topic 均未命中已有主题）' });
    if (t.cat && !catById(t.cat)) issues.push({ lv: 'err', msg: '「' + tag + '」cat 指向不存在的分类：' + t.cat });
    /* v4：cat 为空时必须显式给 topic，否则会被静默算进 DEFAULT_TOPIC */
    if (!t.cat && !t.topic) issues.push({ lv: 'err', msg: '「' + tag + '」既没有 cat 也没有 topic，无法归属主题' });
    /* v4：topic 与 cat 推导结果不一致时，topicOfTerm 会静默以 cat 为准 */
    if (t.cat && t.topic && catById(t.cat) && catById(t.cat).topic !== t.topic){
      issues.push({ lv: 'warn', msg: '「' + tag + '」topic(' + t.topic + ') 与 cat(' + t.cat + ') 推导出的主题不一致，实际以 cat 为准' });
    }
    /* 互链 [[id|文字]] 的 id 必须存在
       v4：扫描范围补齐所有会过 fmt() 的字段（原先漏了 scenario / demoNote /
       usage[].text / variants[].desc / confusions[].say，悬空链接会静默失效） */
    var linkTexts = [t.scenario, t.definition, t.defNote, t.demoAnswer, t.demoNote];
    if (t.sections){
      for (var s = 0; s < t.sections.length; s++){
        linkTexts = linkTexts.concat(t.sections[s].paras || []);
      }
    }
    if (t.usage){
      var uitems = (t.usage.do || []).concat(t.usage.dont || []);
      for (var ux = 0; ux < uitems.length; ux++){ linkTexts.push(uitems[ux] ? uitems[ux].text : ''); }
    }
    if (t.variants){
      for (var vx = 0; vx < t.variants.length; vx++){ linkTexts.push(t.variants[vx].desc); }
    }
    if (t.confusions){
      for (var cx = 0; cx < t.confusions.length; cx++){ linkTexts.push(t.confusions[cx].say); }
    }
    var rxLink = /\[\[([\w-]+)\|/g, mLink;
    for (var f = 0; f < linkTexts.length; f++){
      if (!linkTexts[f]) continue;
      while ((mLink = rxLink.exec(linkTexts[f]))){
        if (!termById(mLink[1])) issues.push({ lv: 'err', msg: '「' + tag + '」互链 id 不存在：[[' + mLink[1] + ']]' });
      }
    }
    if (t.next){
      for (var n = 0; n < t.next.length; n++){
        var nid = typeof t.next[n] === 'string' ? t.next[n] : t.next[n].id;
        if (!nid) issues.push({ lv: 'warn', msg: '「' + tag + '」next 第 ' + (n + 1) + ' 项缺 id' });
        else if (!termById(nid)) issues.push({ lv: 'err', msg: '「' + tag + '」next 指向不存在的词条：' + nid });
        else if (nid === t.id) issues.push({ lv: 'warn', msg: '「' + tag + '」next 指向了自己' });
      }
    }
    /* v3 修复 B3：prereqs 带 id 时必须指向存在的词条 */
    if (t.prereqs){
      for (var pr = 0; pr < t.prereqs.length; pr++){
        var pid = t.prereqs[pr].id;
        if (pid && !termById(pid)) issues.push({ lv: 'err', msg: '「' + tag + '」prereqs 指向不存在的词条：' + pid });
        if (!t.prereqs[pr].name) issues.push({ lv: 'warn', msg: '「' + tag + '」prereqs 第 ' + (pr + 1) + ' 项缺 name' });
      }
    }
    /* v3 修复 B3：refs.url 非空时必须是 http(s) 链接（离线模板允许留空） */
    if (t.refs){
      for (var rf = 0; rf < t.refs.length; rf++){
        var ru = t.refs[rf].url;
        if (ru && !/^https?:\/\//.test(ru)) issues.push({ lv: 'warn', msg: '「' + tag + '」refs.url 非 http(s) 开头：' + ru });
        if (!t.refs[rf].name) issues.push({ lv: 'warn', msg: '「' + tag + '」refs 第 ' + (rf + 1) + ' 项缺 name' });
      }
    }
    /* v3：variants 每项必须有 name */
    if (t.variants){
      for (var vr = 0; vr < t.variants.length; vr++){
        if (!t.variants[vr].name) issues.push({ lv: 'err', msg: '「' + tag + '」variants 第 ' + (vr + 1) + ' 项缺 name' });
      }
    }
    /* v4：正文分点 / 用法 / 场景 / 混淆 的完整性 */
    if (t.sections){
      for (var sh = 0; sh < t.sections.length; sh++){
        var sec = t.sections[sh];
        if (!sec.h) issues.push({ lv: 'warn', msg: '「' + tag + '」sections 第 ' + (sh + 1) + ' 项缺小节标题 h' });
        if (!sec.paras || !sec.paras.length) issues.push({ lv: 'warn', msg: '「' + tag + '」sections「' + (sec.h || (sh + 1)) + '」没有正文段落' });
      }
    }
    if (t.usage){
      var uboxes = [['do', t.usage.do], ['dont', t.usage.dont]];
      for (var ub = 0; ub < uboxes.length; ub++){
        var uarr = uboxes[ub][1] || [];
        for (var uz = 0; uz < uarr.length; uz++){
          if (!uarr[uz].text) issues.push({ lv: 'warn', msg: '「' + tag + '」usage.' + uboxes[ub][0] + ' 第 ' + (uz + 1) + ' 项缺 text' });
        }
      }
    }
    if (t.scenes){
      for (var sc = 0; sc < t.scenes.length; sc++){
        if (!t.scenes[sc].cap) issues.push({ lv: 'warn', msg: '「' + tag + '」scenes 第 ' + (sc + 1) + ' 项缺 cap' });
      }
    }
    if (t.confusions){
      for (var cf = 0; cf < t.confusions.length; cf++){
        if (!t.confusions[cf].name) issues.push({ lv: 'warn', msg: '「' + tag + '」confusions 第 ' + (cf + 1) + ' 项缺 name' });
        if (!t.confusions[cf].say) issues.push({ lv: 'warn', msg: '「' + tag + '」confusions「' + (t.confusions[cf].name || (cf + 1)) + '」缺 say' });
      }
    }
    /* v4：演示图与结论句 / 注解的配套关系（缺一方对应模块就不渲染，属于静默丢失） */
    if (t.demo && !t.demoAnswer) issues.push({ lv: 'warn', msg: '「' + tag + '」有演示图但缺 demoAnswer（图解结论句）' });
    if (!t.demo && t.demoAnswer) issues.push({ lv: 'warn', msg: '「' + tag + '」有 demoAnswer 但没有 demo，结论句不会渲染' });
    if (!t.demo && t.demoNote) issues.push({ lv: 'warn', msg: '「' + tag + '」有 demoNote 但没有 demo，注解不会渲染' });
    if (t.demoCtl && !t.demo) issues.push({ lv: 'err', msg: '「' + tag + '」有 demoCtl 但没有 demo，状态机没有可切换的内容' });
    /* v3：demoCtl 状态机契约（v4：补 label 与 data-at* 取值域自洽） */
    if (t.demoCtl){
      var dc = t.demoCtl;
      if (!(dc.states >= 2 && dc.states <= 9)){
        issues.push({ lv: 'err', msg: '「' + tag + '」demoCtl.states 需在 2-9：' + dc.states });
      }
      if (dc.init != null && (dc.init < 0 || dc.init > dc.states - 1)){
        issues.push({ lv: 'err', msg: '「' + tag + '」demoCtl.init 越界：' + dc.init });
      }
      if (!dc.acts || !dc.acts.length){
        issues.push({ lv: 'err', msg: '「' + tag + '」demoCtl.acts 为空' });
      } else {
        for (var ac = 0; ac < dc.acts.length; ac++){
          var act = dc.acts[ac];
          if (act.step == null && act.to == null){
            issues.push({ lv: 'err', msg: '「' + tag + '」demoCtl.acts[' + ac + '] 缺 step 或 to' });
          }
          if (!act.label) issues.push({ lv: 'warn', msg: '「' + tag + '」demoCtl.acts[' + ac + '] 缺 label（按钮没有文字）' });
          if (act.to != null && (act.to < 0 || act.to > dc.states - 1)){
            issues.push({ lv: 'err', msg: '「' + tag + '」demoCtl.acts[' + ac + '].to 越界：' + act.to });
          }
        }
      }
      /* v4：demo 里的 data-at / data-at-min / data-at-max 必须落在 0..states-1 */
      if (t.demo && dc.states >= 2){
        var rxAt = /data-at(?:-min|-max)?="(\d+)"/g, mAt;
        while ((mAt = rxAt.exec(t.demo))){
          var av = parseInt(mAt[1], 10);
          if (av < 0 || av > dc.states - 1){
            issues.push({ lv: 'err', msg: '「' + tag + '」demo 里 data-at*=' + av + ' 超出 0..' + (dc.states - 1) + ' 的取值域' });
          }
        }
        /* v4：一个 data-at* 标记都没有，说明状态机是空转的 */
        if (!/data-at/.test(t.demo)){
          issues.push({ lv: 'warn', msg: '「' + tag + '」有 demoCtl 但 demo 里没有任何 data-at* 标记，切状态看不出变化' });
        }
      }
    }
    if (t.quiz){
      if (!t.quiz.options || !t.quiz.options.length){
        issues.push({ lv: 'err', msg: '「' + tag + '」quiz.options 为空' });
      } else if (!(t.quiz.answer >= 0 && t.quiz.answer < t.quiz.options.length)){
        issues.push({ lv: 'err', msg: '「' + tag + '」quiz.answer 越界：' + t.quiz.answer });
      }
      if (t.quiz.answer != null && t.quiz.answer !== Math.floor(t.quiz.answer)){
        issues.push({ lv: 'err', msg: '「' + tag + '」quiz.answer 必须是整数：' + t.quiz.answer });
      }
      if (!t.quiz.q) issues.push({ lv: 'warn', msg: '「' + tag + '」quiz 缺题干 q' });
      if (t.quiz.options && t.quiz.options.length && !t.quiz.explain){
        issues.push({ lv: 'warn', msg: '「' + tag + '」quiz 缺 explain（答完不给解释）' });
      }
    }
    /* anatomy 舞台 data-ap 与 parts.idx 双向配对（v4：补序号重复检查） */
    if (t.anatomy){
      if (!t.anatomy.stage) issues.push({ lv: 'warn', msg: '「' + tag + '」anatomy 缺 stage（舞台图）' });
      if (!t.anatomy.parts || !t.anatomy.parts.length) issues.push({ lv: 'warn', msg: '「' + tag + '」anatomy.parts 为空' });
    }
    if (t.anatomy && t.anatomy.stage && t.anatomy.parts){
      var stageIdx = {}, partIdx = {};
      var rxAp = /data-ap="(\d+)"/g, mAp;
      while ((mAp = rxAp.exec(t.anatomy.stage))) stageIdx[mAp[1]] = 1;
      for (var p = 0; p < t.anatomy.parts.length; p++){
        var pk = t.anatomy.parts[p].idx;
        if (partIdx[pk]) issues.push({ lv: 'warn', msg: '「' + tag + '」anatomy.parts 序号重复：' + pk });
        partIdx[pk] = 1;
      }
      for (var k in stageIdx){
        if (!partIdx[k]) issues.push({ lv: 'warn', msg: '「' + tag + '」anatomy 舞台 data-ap=' + k + ' 没有对应 parts 条目' });
      }
      for (var k2 in partIdx){
        if (!stageIdx[k2]) issues.push({ lv: 'warn', msg: '「' + tag + '」anatomy parts.idx=' + k2 + ' 在舞台图中没有 data-ap' });
      }
    }
    /* flow 步骤与 current 序号（v4：补步骤数建议区间与空 steps） */
    if (t.flow){
      if (!t.flow.steps || !t.flow.steps.length){
        issues.push({ lv: 'warn', msg: '「' + tag + '」flow.steps 为空，流程模块不会渲染' });
      } else {
        if (t.flow.current < 1 || t.flow.current > t.flow.steps.length){
          issues.push({ lv: 'err', msg: '「' + tag + '」flow.current 越界：' + t.flow.current + '（共 ' + t.flow.steps.length + ' 步）' });
        }
        if (t.flow.steps.length < 3 || t.flow.steps.length > 7){
          issues.push({ lv: 'warn', msg: '「' + tag + '」flow 步骤数建议 3-7 步，当前 ' + t.flow.steps.length + ' 步' });
        }
        for (var st = 0; st < t.flow.steps.length; st++){
          if (!t.flow.steps[st].tag) issues.push({ lv: 'warn', msg: '「' + tag + '」flow 第 ' + (st + 1) + ' 步缺 tag' });
        }
      }
    }
  }
  return issues;
}
function renderDebug(){
  var box = el('debugReport'), list = el('debugList');
  if (!box || !list) return;
  var issues = validateData();
  var errs = 0, warns = 0;
  for (var i = 0; i < issues.length; i++){ if (issues[i].lv === 'err') errs++; else warns++; }
  box.hidden = false;
  if (!issues.length){
    box.className = 'debug-card';
    box.innerHTML = '<h2>✓ 数据自检通过</h2><span>0 错误 · 0 警告（共 ' + KB_TERMS.length + ' 条词条）</span>';
    list.hidden = true;
    list.innerHTML = '';
  } else {
    box.className = 'debug-card' + (errs ? ' err' : '');
    box.innerHTML = '<h2>' + (errs ? '✕ 自检发现 ' + errs + ' 个错误' : '⚠ 自检通过，另有 ' + warns + ' 个警告') +
      '</h2><span>共 ' + KB_TERMS.length + ' 条词条 · 明细见下方与浏览器控制台</span>';
    var h = '';
    for (var j = 0; j < issues.length; j++){
      h += '<div class="debug-item"><span class="lv ' + issues[j].lv + '">' +
        (issues[j].lv === 'err' ? '错误' : '警告') + '</span><span>' + esc(issues[j].msg) + '</span></div>';
    }
    list.hidden = false;
    list.innerHTML = h;
  }
  try { console.table(issues); } catch (e){ console.log(issues); }
}
