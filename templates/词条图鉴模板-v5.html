/* v5（2026-09-26）：列表/搜索/收藏/更新日志视图的「回到顶部」显隐——滚动过一屏才出现；详情页有自己的返回与上下条，不叠加 */
function syncBackTop(){
  var b = el('backTop');
  if (!b) return;
  var y = window.scrollY || window.pageYOffset || 0;
  b.disabled = !(!state.term && y > 480);
}
/* v5（2026-09-26）：changelog 侧栏「时间定位」滚动高亮——思路与 syncCatActive 同款：最后经过的月份锚点即当前月 */
function syncClSideActive(){
  if (!state.changelog) return;
  var links = document.querySelectorAll('.cl-side-link[data-clmonth]');
  if (!links.length) return;
  var secs = document.querySelectorAll('.cl-entry[id^="cl-m-"]');
  var cur = '';
  for (var i = 0; i < secs.length; i++){
    if (secs[i].getBoundingClientRect().top <= 120) cur = secs[i].id.slice(5);
  }
  for (var b = 0; b < links.length; b++){
    links[b].classList.toggle('on', links[b].getAttribute('data-clmonth') === cur);
  }
}
/* v5（2026-09-26）：筛选条滑动指示器定位——渲染后与 resize 时量 active 按钮的位置 */
function syncClFilterInd(){
  var grp = document.querySelector('.cl-filter');
  if (!grp) return;
  var ind = grp.querySelector('.cl-filter-ind');
  if (!ind) return;
  var act = grp.querySelector('.cl-filter-btn.is-active');
  if (!act){ ind.style.opacity = '0'; return; }
  ind.style.left = act.offsetLeft + 'px';
  ind.style.width = act.offsetWidth + 'px';
  ind.style.opacity = '1';
}
/* v5（2026-09-26 任务书①）：顶栏导航 current 跟随视图——更新日志视图时「更新」高亮，其余场景恢复数据区声明。
   v5（2026-09-27 体验批次）：自测视图时「自测」高亮，与 #changelog 并列处理 */
function syncNavCurrent(){
  var box = el('navLinks');
  if (!box) return;
  var as = box.querySelectorAll('a');
  for (var i = 0; i < as.length; i++){
    var href = as[i].getAttribute('href');
    var isCl = href === '#changelog';
    var isPr = href === '#practice';
    var cur = state.practice ? isPr : state.changelog ? isCl : as[i].hasAttribute('data-cur');
    as[i].classList.toggle('current', cur);
  }
}
/* v5（2026-09-28 工程线体检 D2 修复）：顶栏导航渲染独立成函数——initShell 首渲、applyLangDom 切语言重渲共用。
   label 走 NAV_LABEL_EN 对照（缺则回退中文）；渲染后同步 current 高亮（重渲会清掉旧类名） */
function renderNavLinks(){
  var links = '';
  for (var i = 0; i < (SITE_META.navLinks || []).length; i++){
    var l = SITE_META.navLinks[i];
    var label = (state.lang === 'en' && NAV_LABEL_EN[l.label]) ? NAV_LABEL_EN[l.label] : l.label;
    /* v5（2026-09-26 任务书①）：current 改 data-cur 标记，启动后由 syncNavCurrent 跟随视图切换 */
    var cls = l.current ? ' data-cur="1"' : '';
    if (l.href){
      /* v5（2026-09-26 任务书①）：data-topic 只挂 #topic= 开头的链接——它们靠主题委托切换；
         #changelog 等页面级路由不带它，走原生 hash 导航（否则会被上面的主题委托拦下，链接失效） */
      var isTopicLink = l.href.indexOf('#topic=') === 0;
      links += '<a' + cls + ' href="' + esc(l.href) + '"' +
        (isTopicLink ? ' data-topic="' + esc(state.topic) + '"' : '') +
        (l.external || /^https?:/i.test(l.href) ? ' target="_blank" rel="noopener noreferrer"' : '') +
        '>' + esc(label) + '</a>';
    } else {
      links += '<a' + cls + ' href="' + esc(listHashOf()) + '" data-topic="' + esc(state.topic) + '">' + esc(label) + '</a>';
    }
  }
  el('navLinks').innerHTML = links;
  syncNavCurrent();
}
function initShell(){
  document.title = sm('pageTitle');
  el('brandShort').textContent = sm('brandShort') || sm('brandName');   /* v5（2026-09-27）：logo 旁常驻简称（v1.1.3：走 sm()，可给 brandShortEn） */
  el('brandName').textContent = sm('brandName');
  el('brandTagline').textContent = sm('brandTagline');
  /* v4.1：搜索框 placeholder / aria 与其余静态中文 aria 改由 applyLangDom 按界面语言设置 */
  applyLangDom();
  el('siteFooter').textContent = sm('footerNote');
  el('navBrand').setAttribute('href', listHashOf());
  /* v4：导航项改真链接（此前是没有 href 的 <a>，键盘根本到不了）。
     站内项带 data-topic 走 hash 路由；带 href 的按外链渲染。
     v5（2026-09-28 工程线体检 D2 修复）：构建逻辑抽到 renderNavLinks()——切语言时 applyLangDom 重渲同一函数 */
  renderNavLinks();
}
initShell();
bindEvents();
applyTheme();        /* v4 修复 B11：v3 启动时从未调用 applyTheme，主题按钮初始没有图标/无障碍名 */
parseHash();
syncSearchInput();   /* v4：深链 #topic=xx&q=yy 打开时把搜索词回填到输入框 */
renderApp();
})();

/* ============ v5（2026-09-27 光标第五次修订）：JS 跟随层（§8-6 效果优先例外，照搬参考站 cursor-fx） ============
   独立 IIFE：跟随层出错不殃及主引擎，主引擎出错不影响光标。切回 data-uri 方案的方法见 CSS ⑥ 区注释。
   参考站逻辑要点（无头抓取存档，MEMORY §32-11）：pointermove 里 rAF 合帧 + translate3d 跟随；
   状态判定走 pointerover 的 closest（move 里只在首次现身时判一次）；blur / pointerleave /
   visibilitychange 三路隐藏；监听器全部就位后才加 has-cursor-fx（避免出现「无光标窗口」）。 */
(function(){
  var fx = document.getElementById('cursorFx');
  var htmlEl = document.documentElement;
  if (!fx || !window.matchMedia) return;
  if (!matchMedia('(pointer: fine)').matches) return;                 /* 触屏/粗指针设备：不接管，系统光标照常 */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; /* 减少动效偏好：保留系统光标 */
  var raf = 0, x = 0, y = 0, shown = false, isLink = false;
  /* 可点元素口径 = data-uri 时代圆环的同款清单；[data-card] 覆盖词条卡整卡点击 */
  var SEL = 'a,button,[role="button"],[role="link"],[role="tab"],[role="option"],[role="menuitemradio"],label,summary,select,[data-ddpick],[data-card],.chip.link';
  function step(){
    raf = 0;
    fx.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';   /* GPU 合成，只动 transform */
    if (!shown){ shown = true; fx.classList.add('on'); }
  }
  function setState(t){
    var link = !!(t && t.closest && t.closest(SEL));
    if (link !== isLink){
      isLink = link;
      fx.classList.toggle('is-link', link);   /* 圆环 ⇄ 箭头的变形动画由 CSS transition 完成 */
    }
  }
  function onMove(e){
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    if (!shown) setState(e.target);   /* 参考站同款：首次现身时判一次状态，此后交给 pointerover */
    x = e.clientX; y = e.clientY;
    if (!raf) raf = window.requestAnimationFrame(step);
  }
  function onOver(e){
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    setState(e.target);
  }
  function hide(){
    if (raf){ window.cancelAnimationFrame(raf); raf = 0; }
    shown = false; isLink = false;
    fx.className = 'cursor-fx';   /* 重置到基底类：摘掉 on / is-link，光标隐回 */
  }
  window.addEventListener('pointermove', onMove, {passive: true});
  window.addEventListener('pointerover', onOver, {passive: true});
  window.addEventListener('blur', hide, false);            /* 窗口失焦 */
  htmlEl.addEventListener('pointerleave', hide, false);    /* 鼠标移出窗口 */
  document.addEventListener('visibilitychange', function(){ if (document.hidden) hide(); }, false);
  htmlEl.classList.add('has-cursor-fx');   /* 收尾（参考站同序）：监听器就位后才隐藏系统光标 */
})();
</script>
